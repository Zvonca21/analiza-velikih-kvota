<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza velikih kvota</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:14px;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    margin:10px 0 6px;
}

.opis{
    text-align:center;
    color:#666;
    margin-bottom:18px;
}

.info{
    background:#eaf4ff;
    border-left:5px solid #1677ff;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.6;
}

.box{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:20px;
}

input[type=file]{
    width:100%;
    padding:14px;
    border:2px dashed #aaa;
    border-radius:10px;
    background:#fafafa;
}

button{
    width:100%;
    border:none;
    border-radius:10px;
    padding:15px;
    margin-top:14px;
    background:#1677ff;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

#status{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.progress{
    height:18px;
    background:#ddd;
    border-radius:10px;
    margin-top:10px;
    overflow:hidden;
}

#progressBar{
    height:100%;
    width:0%;
    background:#1677ff;
    transition:.2s;
}

.tipNaslov{
    background:#1677ff;
    color:white;
    padding:12px 15px;
    border-radius:10px;
    margin-top:25px;
    margin-bottom:14px;
}

.utakmica{
    background:#fff;
    border-left:5px solid #1677ff;
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.vrijeme{
    font-weight:bold;
    font-size:16px;
    margin-bottom:5px;
}

.par{
    font-weight:bold;
    font-size:20px;
    line-height:1.35;
    margin-bottom:7px;
}

.liga{
    color:#666;
    font-size:14px;
    margin-bottom:12px;
}

.kvote{
    line-height:1.8;
    font-size:17px;
}

.tip{
    margin-top:12px;
    font-size:19px;
    font-weight:bold;
    color:#d60000;
}

.nema{
    background:#fff3cd;
    padding:18px;
    border-radius:10px;
    text-align:center;
}

.raw{
    margin-top:20px;
    background:#fff;
    border-radius:10px;
    padding:12px;
}

.raw summary{
    cursor:pointer;
    font-weight:bold;
}

.raw pre{
    white-space:pre-wrap;
    word-break:break-word;
    font-size:12px;
}

@media(max-width:600px){
    body{
        padding:8px;
    }

    h1{
        font-size:24px;
    }

    .par{
        font-size:19px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>⚽ Analiza velikih kvota</h1>

<div class="opis">
Analiza nogometnih utakmica sa slika
</div>

<div class="info">
<strong>Kvota domaćina:</strong> 1.60 – 2.10<br>
<strong>Tipovi:</strong> 2:0, 2:1, 3:0, 3:1, 4:0, 4:1
</div>

<div class="box">

<input
    type="file"
    id="images"
    accept="image/*"
    multiple
>

<button
    id="analyzeButton"
    onclick="analiziraj()"
>
ANALIZIRAJ SLIKE
</button>

<div id="status"></div>

<div class="progress">
    <div id="progressBar"></div>
</div>

</div>

<div id="rezultati"></div>

<div id="ocrDebug"></div>

</div>


<script>

/* ===========================================
   POSTAVKE
=========================================== */

const MIN_KVOTA = 1.60;
const MAX_KVOTA = 2.10;

const TIPOVI = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

const TIP_REDOSLIJED = {
    "2:0":1,
    "2:1":2,
    "3:0":3,
    "3:1":4,
    "4:0":5,
    "4:1":6
};


/* ===========================================
   GLAVNA ANALIZA
=========================================== */

async function analiziraj(){

    const input =
        document.getElementById("images");

    const status =
        document.getElementById("status");

    const progressBar =
        document.getElementById("progressBar");

    const button =
        document.getElementById("analyzeButton");

    const rezultatiDiv =
        document.getElementById("rezultati");

    const debugDiv =
        document.getElementById("ocrDebug");


    if(!input.files.length){

        alert("Odaberi barem jednu sliku.");

        return;
    }


    button.disabled = true;

    rezultatiDiv.innerHTML = "";
    debugDiv.innerHTML = "";

    progressBar.style.width = "0%";


    let sveUtakmice = [];
    let sviOCRTekstovi = [];


    for(
        let i = 0;
        i < input.files.length;
        i++
    ){

        status.textContent =
            "Analiziram sliku " +
            (i + 1) +
            " od " +
            input.files.length;


        try{

            const rezultat =
                await Tesseract.recognize(
                    input.files[i],
                    "eng",
                    {
                        logger:m=>{

                            if(
                                m.status ===
                                "recognizing text"
                            ){

                                const ukupno =
                                    (
                                        i +
                                        m.progress
                                    )
                                    /
                                    input.files.length
                                    *
                                    100;

                                progressBar.style.width =
                                    ukupno + "%";
                            }
                        }
                    }
                );


            let tekst =
                rezultat.data.text || "";


            sviOCRTekstovi.push(
                "SLIKA " +
                (i + 1) +
                "\n\n" +
                tekst
            );


            const utakmice =
                obradiOCRTekst(tekst);


            sveUtakmice.push(
                ...utakmice
            );

        }
        catch(error){

            console.error(error);
        }
    }


    sveUtakmice =
        ukloniDuplikate(
            sveUtakmice
        );


    sveUtakmice.sort(
        (a,b)=>{

            const tipA =
                TIP_REDOSLIJED[a.tip] || 99;

            const tipB =
                TIP_REDOSLIJED[b.tip] || 99;


            if(tipA !== tipB){

                return tipA - tipB;
            }


            return a.kvota1 - b.kvota1;
        }
    );


    prikaziUtakmice(
        sveUtakmice
    );


    debugDiv.innerHTML = `

        <details class="raw">

            <summary>
                OCR pročitani tekst
            </summary>

            <pre>${escapeHTML(
                sviOCRTekstovi.join(
                    "\n\n====================\n\n"
                )
            )}</pre>

        </details>

    `;


    progressBar.style.width = "100%";


    status.textContent =
        "Gotovo — pronađeno " +
        sveUtakmice.length +
        " utakmica";


    button.disabled = false;
}


/* ===========================================
   OBRADA OCR TEKSTA
=========================================== */

function obradiOCRTekst(originalniTekst){

    let tekst =
        normalizirajTekst(
            originalniTekst
        );


    /*
        Ključna promjena:

        Kada OCR pročita više utakmica u jednom
        redu, pokušavamo staviti prijelom reda
        prije svakog vremena npr.

        00 45 Houston
        23 00 Chicago
        18 30 Arsenal

        pretvaramo u

        00:45 Houston
        23:00 Chicago
        18:30 Arsenal
    */


    tekst =
        tekst.replace(
            /(?:^|\s)([0-2]?\d)\s+([0-5]\d)\s+(?=[A-ZÀ-Ž])/g,
            "\n$1:$2 "
        );


    tekst =
        tekst.replace(
            /(?:^|\s)([0-2]?\d):([0-5]\d)\s+(?=[A-ZÀ-Ž])/g,
            "\n$1:$2 "
        );


    const linije =
        tekst
        .split("\n")
        .map(
            x => x.trim()
        )
        .filter(Boolean);


    /*
        Svaki novi red koji počinje vremenom
        tretiramo kao mogući početak utakmice.
    */


    let blokovi = [];
    let trenutni = [];


    for(const linija of linije){

        if(
            pocinjeVremenom(linija)
        ){

            if(trenutni.length){

                blokovi.push(
                    trenutni.join(" ")
                );
            }

            trenutni = [
                linija
            ];

        }
        else{

            if(trenutni.length){

                trenutni.push(
                    linija
                );
            }
        }
    }


    if(trenutni.length){

        blokovi.push(
            trenutni.join(" ")
        );
    }


    let rezultati = [];


    for(const blok of blokovi){

        const utakmica =
            parsirajBlok(blok);

        if(utakmica){

            rezultati.push(
                utakmica
            );
        }
    }


    return rezultati;
}


/* ===========================================
   PARSIRANJE JEDNE UTAKMICE
=========================================== */

function parsirajBlok(blok){

    let vrijeme = "";


    const vrijemeMatch =
        blok.match(
            /^([0-2]?\d):([0-5]\d)/
        );


    if(vrijemeMatch){

        vrijeme =
            vrijemeMatch[1]
                .padStart(2,"0")
            +
            ":"
            +
            vrijemeMatch[2];
    }


    /*
        Traženje 1 X 2 kvota.

        Pokušavamo prvo standardni oblik:

        1: 1.90
        X: 3.40
        2: 4.10
    */


    let kvote =
        pronadiKvote(blok);


    if(!kvote){

        return null;
    }


    const {
        kvota1,
        kvotaX,
        kvota2
    } = kvote;


    /*
        Filter velikih kvota
    */


    if(
        kvota1 < MIN_KVOTA ||
        kvota1 > MAX_KVOTA
    ){

        return null;
    }


    const tip =
        pronadiTip(blok);


    if(!tip){

        return null;
    }


    /*
        Izreži tekst prije kvota.
    */


    let pozicijaKvota =
        kvote.pozicija;


    let pocetak =
        blok.substring(
            0,
            pozicijaKvota
        );


    /*
        Makni vrijeme.
    */


    pocetak =
        pocetak.replace(
            /^\s*[0-2]?\d:[0-5]\d\s*/,
            ""
        );


    /*
        Makni ligu u zagradi.
    */


    let liga = "";


    const ligaMatch =
        pocetak.match(
            /\(([^()]*)\)/
        );


    if(ligaMatch){

        liga =
            ligaMatch[1].trim();

        pocetak =
            pocetak.replace(
                ligaMatch[0],
                " "
            );
    }


    pocetak =
        pocetak
        .replace(/\s+/g," ")
        .trim();


    /*
        Klubovi moraju imati separator.
    */


    const parMatch =
        pocetak.match(
            /^(.+?)\s+(?:-|–|—|vs\.?|v)\s+(.+)$/i
        );


    if(!parMatch){

        return null;
    }


    let domacin =
        ocistiKlub(
            parMatch[1]
        );


    let gost =
        ocistiKlub(
            parMatch[2]
        );


    /*
        Dodatna zaštita:

        Ako naziv kluba sadrži previše brojeva,
        "More", "1x2", "Tp" itd.,
        OCR je vjerojatno spojio utakmice.
    */


    domacin =
        ocistiOCRSmece(
            domacin
        );


    gost =
        ocistiOCRSmece(
            gost
        );


    if(
        !domacin ||
        !gost
    ){

        return null;
    }


    /*
        Ne dopuštamo ekstremno dugačak naziv.
        To je gotovo uvijek spojeno više utakmica.
    */


    if(
        domacin.length > 55 ||
        gost.length > 55
    ){

        return null;
    }


    return {

        vrijeme,

        domacin,

        gost,

        liga,

        kvota1,

        kvotaX,

        kvota2,

        tip

    };
}


/* ===========================================
   KVOTE
=========================================== */

function pronadiKvote(blok){

    /*
        Standard:

        1: 1.90 X: 3.20 2: 4.10
    */


    let match =
        blok.match(
            /\b1\s*[:.]?\s*([1-9]\d*[.,]\d{1,2})\s+X\s*[:.]?\s*([1-9]\d*[.,]\d{1,2})\s+2\s*[:.]?\s*([1-9]\d*[.,]\d{1,2})/i
        );


    if(match){

        return {

            kvota1:
                broj(match[1]),

            kvotaX:
                broj(match[2]),

            kvota2:
                broj(match[3]),

            pozicija:
                match.index

        };
    }


    /*
        OCR ponekad pročita:

        190 345 410

        umjesto

        1.90 3.45 4.10

        Ovaj dio pokušava pronaći decimalne
        kvote kada su točke nestale.
    */


    const decimalne =
        [];

    const regex =
        /\b([1-9]\d?[.,]\d{1,2})\b/g;


    let m;


    while(
        (m = regex.exec(blok))
        !== null
    ){

        const vrijednost =
            broj(
                m[1]
            );


        if(
            vrijednost >= 1.01 &&
            vrijednost <= 30
        ){

            decimalne.push({

                value:
                    vrijednost,

                index:
                    m.index

            });
        }
    }


    /*
        Trebamo 3 susjedne kvote.
    */


    for(
        let i = 0;
        i <= decimalne.length - 3;
        i++
    ){

        const a =
            decimalne[i];

        const b =
            decimalne[i + 1];

        const c =
            decimalne[i + 2];


        /*
            X kvota i gostujuća kvota
            obično su nakon prve kvote.
        */


        if(
            a.value >= 1.01 &&
            b.value >= 1.01 &&
            c.value >= 1.01
        ){

            return {

                kvota1:
                    a.value,

                kvotaX:
                    b.value,

                kvota2:
                    c.value,

                pozicija:
                    a.index

            };
        }
    }


    return null;
}


/* ===========================================
   TIP
=========================================== */

function pronadiTip(blok){

    /*
        Prvo traži eksplicitno "Tip"
    */


    const tipMatch =
        blok.match(
            /Tip\s*[:.]?\s*([234])\s*[:\-]\s*([01])/i
        );


    if(tipMatch){

        const tip =
            tipMatch[1] +
            ":" +
            tipMatch[2];


        if(
            TIPOVI.includes(
                tip
            )
        ){

            return tip;
        }
    }


    /*
        Rezervni način.
    */


    for(const tip of TIPOVI){

        const dijelovi =
            tip.split(":");


        const regex =
            new RegExp(
                "\\b" +
                dijelovi[0] +
                "\\s*[:\\-]\\s*" +
                dijelovi[1] +
                "\\b"
            );


        if(regex.test(blok)){

            return tip;
        }
    }


    return null;
}


/* ===========================================
   NORMALIZACIJA OCR-a
=========================================== */

function normalizirajTekst(tekst){

    return tekst

        .replace(/\r/g,"\n")

        .replace(/[|]/g," ")

        .replace(/,/g,".")

        /*
            razni dash znakovi
        */

        .replace(/[‐-‒–—]/g," - ")

        /*
            više praznina
        */

        .replace(/[ \t]+/g," ")

        /*
            previše praznih redova
        */

        .replace(/\n{2,}/g,"\n")

        .trim();
}


/* ===========================================
   PROVJERA VREMENA
=========================================== */

function pocinjeVremenom(linija){

    return /^([0-2]?\d):([0-5]\d)\b/.test(
        linija
    );
}


/* ===========================================
   ČIŠĆENJE KLUBA
=========================================== */

function ocistiKlub(tekst){

    return tekst

        .replace(
            /[^A-Za-zÀ-ž0-9.'&()\/+\-\s]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* ===========================================
   UKLANJANJE OCR SMEĆA
=========================================== */

function ocistiOCRSmece(tekst){

    /*
        Ako se pojavi "More", velika je
        šansa da je OCR nastavio čitati
        sljedeći dio kladioničke ponude.
    */


    tekst =
        tekst.split(
            /\bMore\b/i
        )[0];


    tekst =
        tekst.replace(
            /\b1\s*[xX]\s*2\b.*$/i,
            ""
        );


    tekst =
        tekst.replace(
            /\bTp\b.*$/i,
            ""
        );


    /*
        Briši nizove poput:

        440 384 160
        269 281 261
    */


    tekst =
        tekst.replace(
            /\b\d{3}\s+\d{3}\s+\d{3}\b.*$/,
            ""
        );


    return tekst
        .replace(
            /\s+/g,
            " "
        )
        .trim();
}


/* ===========================================
   BROJ
=========================================== */

function broj(value){

    return parseFloat(
        String(value)
        .replace(",",".")
    );
}


/* ===========================================
   DUPLIKATI
=========================================== */

function ukloniDuplikate(lista){

    const mapa =
        new Map();


    for(const utakmica of lista){

        const key =
            (
                utakmica.domacin +
                "|" +
                utakmica.gost +
                "|" +
                utakmica.tip
            )
            .toLowerCase()
            .replace(/\s+/g,"");


        /*
            Ako se ista utakmica pojavi dvaput
            zbog preklapanja slika,
            ostaje samo jednom.
        */


        if(!mapa.has(key)){

            mapa.set(
                key,
                utakmica
            );
        }
    }


    return [
        ...mapa.values()
    ];
}


/* ===========================================
   PRIKAZ
=========================================== */

function prikaziUtakmice(lista){

    const div =
        document.getElementById(
            "rezultati"
        );


    div.innerHTML = "";


    if(!lista.length){

        div.innerHTML = `

            <div class="nema">

            Nema pronađenih utakmica
            s kvotom domaćina od

            <strong>
            1.60 do 2.10
            </strong>.

            </div>

        `;

        return;
    }


    let trenutniTip = "";


    for(const u of lista){


        if(
            u.tip !== trenutniTip
        ){

            trenutniTip =
                u.tip;


            div.innerHTML += `

                <div class="tipNaslov">

                    Tip ${u.tip}

                </div>

            `;
        }


        div.innerHTML += `

            <div class="utakmica">

                ${
                    u.vrijeme
                    ?
                    `<div class="vrijeme">
                        ${u.vrijeme}
                    </div>`
                    :
                    ""
                }

                <div class="par">

                    ${escapeHTML(u.domacin)}

                    —

                    ${escapeHTML(u.gost)}

                </div>

                ${
                    u.liga
                    ?
                    `<div class="liga">
                        (${escapeHTML(u.liga)})
                    </div>`
                    :
                    ""
                }

                <div class="kvote">

                    1:
                    <strong>
                    ${u.kvota1.toFixed(2)}
                    </strong>

                    &nbsp;&nbsp;

                    X:
                    ${u.kvotaX.toFixed(2)}

                    &nbsp;&nbsp;

                    2:
                    ${u.kvota2.toFixed(2)}

                </div>

                <div class="tip">
