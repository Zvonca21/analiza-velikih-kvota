<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza velikih kvota</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    font-family:Arial,sans-serif;
    background:#f3f4f8;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:36px;
    margin:28px 0;
    line-height:1.25;
}

    background:#e7f3ff;
    border-left:6px solid #1683ff;

    margin-bottom:20px;
}

    background:#fff;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

input[type=file]{
    width:100%;

</style>
</head>

<body>

<div class="container">

<h1>⚽ Analiza velikih kvota ⚽</h1>

<div class="info">
    <strong>Kvota domaćina:</strong> 1.60 – 2.10
    <br>
    <strong>Tipovi:</strong> 2:0, 2:1, 3:0, 3:1, 4:0, 4:1
</div>

<div class="box">

    <input
        id="images"
        type="file"
        accept="image/*"
        multiple
    >

    <button
        id="analyzeButton"
        type="button"
        onclick="pokreniAnalizu()"
    >
        ANALIZIRAJ SLIKE
    </button>

    <div id="status"></div>

    <div class="progress">
        <div id="progressBar"></div>
    </div>

</div>

<div id="rezultati"></div>

<div id="debug"></div>

</div>

<script>

/* =========================================================
   POSTAVKE
========================================================= */

var MIN_KVOTA = 1.60;
var MAX_KVOTA = 2.10;

var TIPOVI = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

var TIP_ORDER = {
    "2:0":1,
    "2:1":2,
    "3:0":3,
    "3:1":4,
    "4:0":5,
    "4:1":6
};


/* =========================================================
   UČITAVANJE TESSERACTA
========================================================= */

function ucitajTesseract(){

    return new Promise(function(resolve,reject){

        if(typeof Tesseract !== "undefined"){
            resolve();
            return;
        }


        var script =
            document.createElement("script");

        script.src =
            "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";


        script.onload = function(){

            if(typeof Tesseract !== "undefined"){
                resolve();
            }else{
                ucitajRezervniTesseract(resolve,reject);
            }
        };


        script.onerror = function(){

            ucitajRezervniTesseract(resolve,reject);

        };


        document.head.appendChild(script);

    });
}


function ucitajRezervniTesseract(resolve,reject){

    var script =
        document.createElement("script");

    script.src =
        "https://unpkg.com/tesseract.js@5/dist/tesseract.min.js";


    script.onload = function(){

        if(typeof Tesseract !== "undefined"){

            resolve();

        }else{

            reject(
                new Error(
                    "OCR biblioteka se nije uspjela učitati."
                )
            );
        }
    };


    script.onerror = function(){

        reject(
            new Error(
                "OCR biblioteka se nije uspjela učitati."
            )
        );
    };


    document.head.appendChild(script);
}


/* =========================================================
   GLAVNA ANALIZA
========================================================= */

async function pokreniAnalizu(){

    var input =
        document.getElementById("images");

    var button =
        document.getElementById("analyzeButton");

    var status =
        document.getElementById("status");

    var progress =
        document.getElementById("progressBar");

    var rezultatiDiv =
        document.getElementById("rezultati");

    var debugDiv =
        document.getElementById("debug");


    if(
        !input.files ||
        input.files.length === 0
    ){

        alert(
            "Odaberi barem jednu sliku."
        );

        return;
    }


    status.innerHTML =
        "Pokrećem analizu...";

    progress.style.width =
        "2%";

    button.disabled =
        true;

    rezultatiDiv.innerHTML =
        "";

    debugDiv.innerHTML =
        "";


    try{

        await ucitajTesseract();

    }
    catch(error){

        status.innerHTML =
            "Greška: OCR se nije učitao.";

        alert(
            error.message
        );

        button.disabled =
            false;

        return;
    }


    var sveUtakmice =
        [];

    var sviOCR =
        [];


    try{

        for(
            var i = 0;
            i < input.files.length;
            i++
        ){

            var file =
                input.files[i];


            status.innerHTML =
                "Analiziram sliku " +
                (i + 1) +
                " od " +
                input.files.length +
                "...";


            var trenutniIndex =
                i;


            var rezultat =
                await Tesseract.recognize(
                    file,
                    "eng",
                    {

                        logger:function(m){

                            if(
                                m.status ===
                                "recognizing text"
                            ){

                                var dio =
                                    m.progress || 0;


                                var ukupno =
                                    (
                                        trenutniIndex +
                                        dio
                                    )
                                    /
                                    input.files.length
                                    *
                                    100;


                                progress.style.width =
                                    ukupno +
                                    "%";


                                status.innerHTML =
                                    "Analiziram sliku " +
                                    (trenutniIndex + 1) +
                                    " od " +
                                    input.files.length +
                                    " — " +
                                    Math.round(
                                        dio * 100
                                    ) +
                                    "%";
                            }
                        }
                    }
                );


            var tekst =
                rezultat.data.text || "";


            sviOCR.push(
                "SLIKA " +
                (i + 1) +
                "\n\n" +
                tekst
            );


            var pronadene =
                pronadiUtakmice(
                    tekst
                );


            sveUtakmice =
                sveUtakmice.concat(
                    pronadene
                );
        }


        sveUtakmice =
            ukloniDuplikate(
                sveUtakmice
            );


        sveUtakmice.sort(
            function(a,b){

                var tipA =
                    TIP_ORDER[a.tip] || 99;

                var tipB =
                    TIP_ORDER[b.tip] || 99;


                if(
                    tipA !== tipB
                ){

                    return (
                        tipA -
                        tipB
                    );
                }


                return (
                    a.kvota1 -
                    b.kvota1
                );
            }
        );


        prikaziRezultate(
            sveUtakmice
        );


        debugDiv.innerHTML =

            '<details>' +

            '<summary>' +
            'OCR pročitano' +
            '</summary>' +

            '<pre>' +

            escapeHTML(
                sviOCR.join(
                    "\n\n====================\n\n"
                )
            ) +

            '</pre>' +

            '</details>';


        progress.style.width =
            "100%";


        status.innerHTML =
            "Gotovo — pronađeno " +
            sveUtakmice.length +
            " utakmica.";

    }

    catch(error){

        console.error(error);


        status.innerHTML =
            "GREŠKA: " +
            error.message;


        alert(
            "Greška pri analizi: " +
            error.message
        );
    }


    button.disabled =
        false;
}


/* =========================================================
   OCR OBRADA
========================================================= */

function pronadiUtakmice(tekst){

    var lista = [];


    tekst =
        String(tekst)

        .replace(/\r/g,"\n")

        .replace(/,/g,".")

        .replace(/\|/g," ")

        .replace(/[–—]/g,"-")

        .replace(/\t/g," ")

        .replace(/ +/g," ");


    /*
        OCR često pročita:

        17 30 Gornik

        umjesto:

        17:30 Gornik
    */

    tekst =
        tekst.replace(
            /\b([0-2]?[0-9])\s+([0-5][0-9])\s+(?=[A-Za-zÀ-ž])/g,
            "\n$1:$2 "
        );


    /*
        Novi red prije svakog vremena
    */

    tekst =
        tekst.replace(
            /([^\n])\s+([0-2]?[0-9]:[0-5][0-9])\s+(?=[A-Za-zÀ-ž])/g,
            "$1\n$2 "
        );


    var linije =
        tekst
        .split("\n")
        .map(
            function(x){

                return x.trim();

            }
        )
        .filter(
            function(x){

                return x.length > 0;

            }
        );


    var trenutnaLiga =
        "";


    for(
        var i = 0;
        i < linije.length;
        i++
    ){

        var red =
            linije[i];


        /*
            Liga
        */

        if(
            jeLiga(red)
        ){

            trenutnaLiga =
                ocistiLigu(
                    red
                );

            continue;
        }


        /*
            Prvo probaj samo jedan red.
        */

        var utakmica =
            parsirajRed(
                red,
                trenutnaLiga
            );


        if(utakmica){

            lista.push(
                utakmica
            );

            continue;
        }


        /*
            Ako je OCR prelomio utakmicu
            u dva retka.
        */

        if(
            i + 1 <
            linije.length
        ){

            var sljedeci =
                linije[
                    i + 1
                ];


            /*
                Ne spajaj ako sljedeći red
                već počinje drugom utakmicom.
            */

            if(
                !/^[0-2]?[0-9]:[0-5][0-9]\b/
                .test(
                    sljedeci
                )
            ){

                var spoj2 =
                    red +
                    " " +
                    sljedeci;


                utakmica =
                    parsirajRed(
                        spoj2,
                        trenutnaLiga
                    );


                if(utakmica){

                    lista.push(
                        utakmica
                    );
                }
            }
        }
    }


    return lista;
}


/* =========================================================
   PARSIRANJE JEDNE UTAKMICE
========================================================= */

function parsirajRed(
    red,
    liga
){

    var vrijemeMatch =
        red.match(
            /\b([0-2]?[0-9]):([0-5][0-9])\b/
        );


    if(
        !vrijemeMatch
    ){

        return null;
    }


    var vrijeme =
        vrijemeMatch[1]
        .padStart(
            2,
            "0"
        )
        +
        ":" +
        vrijemeMatch[2];


    /*
        Ako imamo drugo vrijeme u istom retku,
        odreži sve iza njega.
    */

    var ostatak =
        red.substring(
            vrijemeMatch.index +
            vrijemeMatch[0].length
        );


    var drugoVrijeme =
        ostatak.search(
            /\b[0-2]?[0-9]:[0-5][0-9]\b/
        );


    if(
        drugoVrijeme >= 0
    ){

        red =
            red.substring(
                0,
                vrijemeMatch.index +
                vrijemeMatch[0].length +
                drugoVrijeme
            );
    }


    /*
        TIP
    */

    var tipPodatak =
        pronadiTip(
            red
        );


    if(
        !tipPodatak
    ){

        return null;
    }


    /*
        Koristimo samo tekst PRIJE tipa.
    */

    var dioPrijeTipa =
        red.substring(
            0,
            tipPodatak.index
        );


    /*
        KVOTE S TOČKAMA
    */

    var brojevi =
        pronadiDecimalneKvote(
            dioPrijeTipa
        );


    /*
        Ako OCR nije pročitao točke,
        probaj brojeve poput:

        167 362 430
    */

    if(
        brojevi.length < 3
    ){

        brojevi =
            pronadiCijeleKvote(
                dioPrijeTipa
            );
    }


    if(
        brojevi.length < 3
    ){

        return null;
    }


    /*
        Zadnja tri broja prije tipa
        moraju biti 1 / X / 2.
    */

    var zadnjeTri =
        brojevi.slice(
            -3
        );


    var kvota1 =
        zadnjeTri[0].value;

    var kvotaX =
        zadnjeTri[1].value;

    var kvota2 =
        zadnjeTri[2].value;


    /*
        FILTER KVOTE DOMAĆINA
    */

    if(
        kvota1 <
        MIN_KVOTA
        ||
        kvota1 >
        MAX_KVOTA
    ){

        return null;
    }


    if(
        kvotaX < 1.01 ||
        kvotaX > 50 ||
        kvota2 < 1.01 ||
        kvota2 > 50
    ){

        return null;
    }


    /*
        NAZIV UTAKMICE

        samo između vremena i prve kvote
    */

    var startNaziva =
        vrijemeMatch.index +
        vrijemeMatch[0].length;


    var krajNaziva =
        zadnjeTri[0].index;


    var naziv =
        dioPrijeTipa.substring(
            startNaziva,
            krajNaziva
        );


    naziv =
        naziv

        .replace(
            /\bMore\b.*$/i,
            ""
        )

        .replace(
            /\b1\s+X\s+2\s+Tip\b/gi,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();


    /*
        Makni zalijepljene OCR brojeve:

        Benfica 820 570 129
    */

    naziv =
        naziv.replace(
            /\s+\d{3,4}(?:\s+\d{3,4})+.*$/,
            ""
        );


    /*
        Pronađi separator domaćin - gost.
    */

    var separator =
        naziv.indexOf(
            "-"
        );


    if(
        separator === -1
    ){

        return null;
    }


    var domacin =
        naziv
        .substring(
            0,
            separator
        )
        .trim();


    var gost =
        naziv
        .substring(
            separator + 1
        )
        .trim();


    domacin =
        ocistiNaziv(
            domacin
        );


    gost =
        ocistiNaziv(
            gost
        );


    /*
        Još jednom briši OCR brojeve
        na kraju imena gosta.
    */

    gost =
        gost.replace(
            /\s+\d{3,4}(?:\s+\d{3,4})+.*$/,
            ""
        )
        .trim();


    if(
        !domacin ||
        !gost
    ){

        return null;
    }


    if(
        domacin.length > 60 ||
        gost.length > 60
    ){

        return null;
    }


    return {

        vrijeme:
            vrijeme,

        domacin:
            domacin,

        gost:
            gost,

        liga:
            liga,

        kvota1:
            kvota1,

        kvotaX:
            kvotaX,

        kvota2:
            kvota2,

        tip:
            tipPodatak.tip
    };
}


/* =========================================================
   DECIMALNE KVOTE
========================================================= */

function pronadiDecimalneKvote(
    tekst
){

    var lista =
        [];


    var regex =
        /\b([0-9]{1,2}\.[0-9]{1,2})\b/g;


    var match;


    while(
        (
            match =
            regex.exec(
                tekst
            )
        )
        !==
        null
    ){

        var vrijednost =
            parseFloat(
                match[1]
            );


        if(
            vrijednost >= 1.01 &&
            vrijednost <= 50
        ){

            lista.push({

                value:
                    vrijednost,

                index:
                    match.index

            });
        }
    }


    return lista;
}


/* =========================================================
   KVOTE BEZ TOČKE
========================================================= */

function pronadiCijeleKvote(
    tekst
){

    var lista =
        [];


    var regex =
        /\b([0-9]{3,4})\b/g;


    var match;


    while(
        (
            match =
            regex.exec(
                tekst
            )
        )
        !==
        null
    ){

        var raw =
            match[1];


        var value;


        if(
            raw.length === 3
        ){

            value =
                parseFloat(
                    raw.charAt(0) +
                    "." +
                    raw.substring(1)
                );

        }
        else{

            value =
                parseFloat(
                    raw.substring(
                        0,
                        raw.length - 2
                    )
                    +
                    "." +
                    raw.substring(
                        raw.length - 2
                    )
                );
        }


        if(
            value >= 1.01 &&
            value <= 50
        ){

            lista.push({

                value:
                    value,

                index:
                    match.index

            });
        }
    }


    return lista;
}


/* =========================================================
   TIP
========================================================= */

function pron
