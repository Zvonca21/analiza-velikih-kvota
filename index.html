<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza velikih kvota</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:12px;
    font-family:Arial,sans-serif;
    background:#f3f4f8;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:34px;
    margin:25px 0;
}

.info{
    background:#e8f4ff;
    border-left:6px solid #1683ff;
    padding:18px;
    border-radius:12px;
    margin-bottom:20px;
    font-size:18px;
    line-height:1.7;
}

.box{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

input[type=file]{
    width:100%;
    padding:15px;
    border:2px dashed #999;
    border-radius:12px;
}

button{
    width:100%;
    margin-top:15px;
    padding:18px;
    border:0;
    border-radius:12px;
    background:#1683ff;
    color:white;
    font-size:20px;
    font-weight:bold;
}

button:disabled{
    background:#999;
}

#status{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin-top:18px;
}

.progress{
    height:18px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-top:15px;
}

#progressBar{
    height:100%;
    width:0%;
    background:#1683ff;
}

.tipNaslov{
    background:#1683ff;
    color:white;
    padding:15px;
    border-radius:12px;
    font-size:25px;
    font-weight:bold;
    margin:25px 0 15px;
}

.utakmica{
    background:white;
    border-left:6px solid #1683ff;
    padding:17px;
    border-radius:12px;
    margin-bottom:15px;
}

.vrijeme{
    font-weight:bold;
    font-size:18px;
}

.par{
    font-size:21px;
    font-weight:bold;
    margin:7px 0;
}

.liga{
    color:#666;
    margin-bottom:10px;
}

.kvote{
    font-size:17px;
    line-height:1.8;
}

.tip{
    color:#d00000;
    font-size:20px;
    font-weight:bold;
    margin-top:10px;
}

.nema{
    background:#fff3cd;
    padding:18px;
    border-radius:12px;
    text-align:center;
}

details{
    background:white;
    padding:14px;
    border-radius:12px;
    margin-top:20px;
}

pre{
    white-space:pre-wrap;
    word-break:break-word;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>⚽ Analiza velikih kvota</h1>

<div class="info">
<strong>Kvota domaćina:</strong> 1.60 – 2.10<br>
<strong>Tipovi:</strong> 2:0, 2:1, 3:0, 3:1, 4:0, 4:1
</div>

<div class="box">

<input
    id="images"
    type="file"
    accept="image/*"
    multiple
>

<button id="analyzeButton">
ANALIZIRAJ SLIKE
</button>

<div id="status"></div>

<div class="progress">
    <div id="progressBar"></div>
</div>

</div>

<div id="rezultati"></div>
<div id="debug"></div>

</div>

<script>

var MIN_KVOTA = 1.60;
var MAX_KVOTA = 2.10;

var TIPOVI = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

var TIP_ORDER = {
    "2:0":1,
    "2:1":2,
    "3:0":3,
    "3:1":4,
    "4:0":5,
    "4:1":6
};


/* GUMB */

document
.getElementById("analyzeButton")
.addEventListener("click", function(){

    analiziraj();

});


async function analiziraj(){

    var input =
        document.getElementById("images");

    var status =
        document.getElementById("status");

    var button =
        document.getElementById("analyzeButton");

    var progressBar =
        document.getElementById("progressBar");

    var rezultatiDiv =
        document.getElementById("rezultati");

    var debugDiv =
        document.getElementById("debug");


    if(!input.files || input.files.length === 0){

        alert("Odaberi barem jednu sliku.");

        return;
    }


    status.innerHTML =
        "Pokrećem analizu...";

    button.disabled = true;

    progressBar.style.width = "1%";

    rezultatiDiv.innerHTML = "";

    debugDiv.innerHTML = "";


    var sve = [];

    var sviTekstovi = [];


    try{

        for(
            var i = 0;
            i < input.files.length;
            i++
        ){

            status.innerHTML =
                "Analiziram sliku " +
                (i + 1) +
                " od " +
                input.files.length +
                "...";


            var result =
                await Tesseract.recognize(
                    input.files[i],
                    "eng",
                    {
                        logger:function(m){

                            if(
                                m.status ===
                                "recognizing text"
                            ){

                                var pct =
                                    Math.round(
                                        m.progress * 100
                                    );

                                progressBar.style.width =
                                    pct + "%";
                            }
                        }
                    }
                );


            var tekst =
                result.data.text || "";


            sviTekstovi.push(
                "SLIKA " +
                (i + 1) +
                "\n\n" +
                tekst
            );


            var utakmice =
                pronadiUtakmice(
                    tekst
                );


            sve =
                sve.concat(
                    utakmice
                );
        }


        sve =
            ukloniDuplikate(
                sve
            );


        sve.sort(function(a,b){

            if(
                TIP_ORDER[a.tip] !==
                TIP_ORDER[b.tip]
            ){

                return (
                    TIP_ORDER[a.tip] -
                    TIP_ORDER[b.tip]
                );
            }

            return a.kvota1 - b.kvota1;

        });


        prikazi(sve);


        debugDiv.innerHTML =
            "<details>" +
            "<summary>OCR pročitano</summary>" +
            "<pre>" +
            escapeHTML(
                sviTekstovi.join(
                    "\n\n================\n\n"
                )
            ) +
            "</pre>" +
            "</details>";


        progressBar.style.width =
            "100%";


        status.innerHTML =
            "Gotovo — pronađeno " +
            sve.length +
            " utakmica.";

    }

    catch(error){

        console.error(error);

        status.innerHTML =
            "GREŠKA: " +
            error.message;

        alert(
            "Greška pri analizi: " +
            error.message
        );
    }


    button.disabled = false;
}



/* OCR */

function pronadiUtakmice(tekst){

    var rezultati = [];


    tekst =
        String(tekst)
        .replace(/\r/g,"\n")
        .replace(/,/g,".")
        .replace(/\|/g," ")
        .replace(/\t/g," ")
        .replace(/ +/g," ");


    /*
       15 00 Tobol
       pretvori u
       15:00 Tobol
    */

    tekst =
        tekst.replace(
            /\b([0-2]?[0-9])\s+([0-5][0-9])\s+(?=[A-Za-z])/g,
            "\n$1:$2 "
        );


    /*
       novi red prije vremena
    */

    tekst =
        tekst.replace(
            /([^\n])\s+([0-2]?[0-9]:[0-5][0-9])\s+/g,
            "$1\n$2 "
        );


    var linije =
        tekst
        .split("\n")
        .map(function(x){
            return x.trim();
        })
        .filter(function(x){
            return x.length > 0;
        });


    var liga = "";


    for(
        var i = 0;
        i < linije.length;
        i++
    ){

        var red =
            linije[i];


        if(jeLiga(red)){

            liga =
                ocistiLigu(red);

            continue;
        }


        /*
           1 RED
        */

        var u =
            parsirajRed(
                red,
                liga
            );


        if(u){

            rezultati.push(u);

            continue;
        }


        /*
           2 REDA
        */

        if(
            i + 1 <
            linije.length
        ){

            var dva =
                red +
                " " +
                linije[i + 1];


            u =
                parsirajRed(
                    dva,
                    liga
                );


            if(u){

                rezultati.push(u);

                continue;
            }
        }


        /*
           3 REDA
        */

        if(
            i + 2 <
            linije.length
        ){

            var tri =
                red +
                " " +
                linije[i + 1] +
                " " +
                linije[i + 2];


            u =
                parsirajRed(
                    tri,
                    liga
                );


            if(u){

                rezultati.push(u);
            }
        }
    }


    return rezultati;
}



function parsirajRed(red, liga){

    var timeMatch =
        red.match(
            /\b([0-2]?[0-9]):([0-5][0-9])\b/
        );


    if(!timeMatch){

        return null;
    }


    var vrijeme =
        timeMatch[1]
        .padStart(2,"0")
        +
        ":" +
        timeMatch[2];


    /*
       Pronađi sve decimalne brojeve
    */

    var brojevi = [];

    var regex =
        /\b([0-9]{1,2}\.[0-9]{1,2})\b/g;

    var match;


    while(
        (match = regex.exec(red))
        !== null
    ){

        var n =
            parseFloat(
                match[1]
            );


        if(
            n >= 1.01 &&
            n <= 50
        ){

            brojevi.push({

                broj:n,

                index:match.index

            });
        }
    }


    if(
        brojevi.length < 3
    ){

        return null;
    }


    /*
       Tražimo trojku kvota.
    */

    var odabrane = null;


    for(
        var i = 0;
        i <= brojevi.length - 3;
        i++
    ){

        var k1 =
            brojevi[i].broj;

        var kX =
            brojevi[i + 1].broj;

        var k2 =
            brojevi[i + 2].broj;


        if(
            k1 >= MIN_KVOTA &&
            k1 <= MAX_KVOTA &&
            kX >= 1.01 &&
            k2 >= 1.01
        ){

            odabrane = {

                kvota1:k1,

                kvotaX:kX,

                kvota2:k2,

                index:
                    brojevi[i].index

            };

            break;
        }
    }


    if(!odabrane){

        return null;
    }


    /*
       TIP
    */

    var tip =
        pronadiTip(red);


    if(!tip){

        return null;
    }


    /*
       Naziv utakmice
    */

    var start =
        timeMatch.index +
        timeMatch[0].length;


    var naziv =
        red.substring(
            start,
            odabrane.index
        )
        .trim();


    /*
       očisti tablične oznake
    */

    naziv =
        naziv
        .replace(/\b1\s+X\s+2\s+Tip\b/gi,"")
        .replace(/\bMore\b.*$/gi,"")
        .replace(/ +/g," ")
        .trim();


    var separator =
        naziv.indexOf("-");


    if(separator === -1){

        return null;
    }


    var domacin =
        naziv
        .substring(
            0,
            separator
        )
        .trim();


    var gost =
        naziv
        .substring(
            separator + 1
        )
        .trim();


    if(
        !domacin ||
        !gost
    ){

        return null;
    }


    /*
       Ako se pojavi drugo vrijeme,
       odreži sve iza njega.
    */

    gost =
        gost.replace(
            /\b[0-2]?[0-9]:[0-5][0-9]\b.*$/,
            ""
        )
        .trim();


    if(
        domacin.length > 60 ||
        gost.length > 60
    ){

        return null;
    }


    return {

        vrijeme:vrijeme,

        domacin:domacin,

        gost:gost,

        liga:liga,

        kvota1:
            odabrane.kvota1,

        kvotaX:
            odabrane.kvotaX,

        kvota2:
            odabrane.kvota2,

        tip:tip
    };
}



function pronadiTip(red){

    var matches = [];

    var regex =
        /\b([234])\s*:\s*([01])\b/g;

    var m;


    while(
        (m = regex.exec(red))
        !== null
    ){

        var t =
            m[1] +
            ":" +
            m[2];


        if(
            TIPOVI.indexOf(t)
            !== -1
        ){

            matches.push(t);
        }
    }


    if(matches.length){

        return matches[
            matches.length - 1
        ];
    }


    /*
       OCR bez dvotočke:
       20,21,30,31,40,41
    */

    var kraj =
        red.match(
            /\b(20|21|30|31|40|41)\b\s*(?:More)?\s*$/i
        );


    if(kraj){

        return (
            kraj[1].charAt(0) +
            ":" +
            kraj[1].charAt(1)
        );
    }


    return null;
}



function jeLiga(red){

    if(
        /^\d{1,2}:\d{2}/.test(red)
    ){

        return false;
    }


    return (
        /League/i.test(red) ||
        /Liga/i.test(red) ||
        /Division/i.test(red) ||
        /Cup/i.test(red) ||
        /Premiership/i.test(red) ||
        /Superettan/i.test(red) ||
        /Allsvenskan/i.test(red) ||
        /Championship/i.test(red) ||
        /Eredivisie/i.test(red) ||
        /Ekstraklasa/i.test(red)
    );
}



function ocistiLigu(red){

    return red

        .replace(
            /\b1\s+X\s+2\s+Tip\b/gi,
            ""
        )

        .replace(
            / +/g,
            " "
        )

        .trim();
}



function ukloniDuplikate(lista){

    var mapa = {};


    return lista.filter(
        function(u){

            var key =
                (
                    u.domacin +
                    "|" +
                    u.gost +
                    "|" +
                    u.tip
                )
                .toLowerCase()
                .replace(/\s/g,"");


            if(mapa[key]){

                return false;
            }


            mapa[key] = true;

            return true;
        }
    );
}



function prikazi(lista){

    var div =
        document.getElementById(
            "rezultati"
        );


    div.innerHTML = "";


    if(lista.length === 0){

        div.innerHTML =
            '<div class="nema">' +
            'Nema pronađenih utakmica s kvotom domaćina od ' +
            '<strong>1.60 do 2.10</strong>.' +
            '</div>';

        return;
    }


    var zadnjiTip = "";


    lista.forEach(
        function(u){


            if(
                u.tip !== zadnjiTip
            ){

                zadnjiTip =
                    u.tip;


                div.innerHTML +=

                    '<div class="tipNaslov">' +
                    'Tip ' +
                    u.tip +
                    '</div>';
            }


            div.innerHTML +=

                '<div class="utakmica">' +

                '<div class="vrijeme">' +
                escapeHTML(u.vrijeme) +
                '</div>' +

                '<div class="par">' +
                escapeHTML(u.domacin) +
                ' — ' +
                escapeHTML(u.gost) +
                '</div>' +

                (
                    u.liga
                    ?
                    '<div class="liga">(' +
                    escapeHTML(u.liga) +
                    ')</div>'
                    :
                    ''
                ) +

                '<div class="kvote">' +

                '1: <strong>' +
                u.kvota1.toFixed(2) +
                '</strong>' +

                '&nbsp;&nbsp; X: ' +
                u.kvotaX.toFixed(2) +

                '&nbsp;&nbsp; 2: ' +
                u.kvota2.toFixed(2) +

                '</div>' +

                '<div class="tip">' +
                'Tip: ' +
                u.tip +
                '</div>' +

                '</div>';
        }
    );
}



function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
