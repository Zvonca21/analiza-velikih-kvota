<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza velikih kvota</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

    margin: 0;
    padding: 10px;
    font-family: Arial, sans-serif;
    background: #f3f4f8;

}

    max-width: 900px;
    margin: auto;
}

}

.info {
    background: #e8f4ff;
    border-left: 6px solid #1683ff;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 20px;

    line-height: 1.7;
}

    background: white;
    padding: 20px;

    margin-bottom: 20px;
}

input[type="file"] {
    width: 100%;
    padding: 15px;
    border: 2px dashed #999;
    border-radius: 12px;
}

    width: 100%;

}

.utakmica {
    background: white;
    border-left: 6px solid #1683ff;
    padding: 17px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.vrijeme {
    font-weight: bold;

}

}

}

}

}

.nema {

}

}

}

@media(max-width: 600px) {

    }

    }
}
</style>
</head>

<body>

<div class="container">

<h1>⚽ Analiza velikih kvota</h1>

<div class="info">
    <strong>Kvota domaćina:</strong> 1.60 – 2.10<br>
    <strong>Tipovi:</strong> 2:0, 2:1, 3:0, 3:1, 4:0, 4:1
</div>

<div class="box">

<input
    id="images"
    type="file"
    accept="image/*"
    multiple
>

<button id="analyzeButton">
    ANALIZIRAJ SLIKE
</button>

<div id="status"></div>

<div class="progress">
    <div id="progressBar"></div>
</div>

</div>

<div id="rezultati"></div>

<div id="debug"></div>

</div>


<script>

/* =====================================================
   POSTAVKE
===================================================== */

const MIN_KVOTA = 1.60;
const MAX_KVOTA = 2.10;

const TIPOVI = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

const TIP_ORDER = {
    "2:0": 1,
    "2:1": 2,
    "3:0": 3,
    "3:1": 4,
    "4:0": 5,
    "4:1": 6
};


/* =====================================================
   GUMB
===================================================== */

document
.getElementById("analyzeButton")
.addEventListener("click", analiziraj);


/* =====================================================
   GLAVNA ANALIZA
===================================================== */

async function analiziraj() {

    const input =
        document.getElementById("images");

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("analyzeButton");

    const progress =
        document.getElementById("progressBar");

    const rezultati =
        document.getElementById("rezultati");

    const debug =
        document.getElementById("debug");


    if (!input.files || input.files.length === 0) {

        alert("Odaberi barem jednu sliku.");

        return;
    }


    button.disabled = true;

    status.textContent =
        "Pokrećem analizu...";

    progress.style.width =
        "1%";

    rezultati.innerHTML = "";

    debug.innerHTML = "";


    let sveUtakmice = [];

    let sviOCR = [];


    try {

        for (
            let i = 0;
            i < input.files.length;
            i++
        ) {

            status.textContent =
                "Analiziram sliku " +
                (i + 1) +
                " od " +
                input.files.length +
                "...";


            const rezultat =
                await Tesseract.recognize(
                    input.files[i],
                    "eng",
                    {
                        logger: function(m) {

                            if (
                                m.status ===
                                "recognizing text"
                            ) {

                                const ukupno =
                                    (
                                        i +
                                        m.progress
                                    )
                                    /
                                    input.files.length
                                    *
                                    100;

                                progress.style.width =
                                    ukupno + "%";
                            }
                        }
                    }
                );


            const tekst =
                rezultat.data.text || "";


            sviOCR.push(
                "SLIKA " +
                (i + 1) +
                "\n\n" +
                tekst
            );


            const utakmice =
                obradiSliku(
                    tekst
                );


            sveUtakmice.push(
                ...utakmice
            );
        }


        sveUtakmice =
            ukloniDuplikate(
                sveUtakmice
            );


        sveUtakmice.sort(
            function(a, b) {

                if (
                    TIP_ORDER[a.tip] !==
                    TIP_ORDER[b.tip]
                ) {

                    return (
                        TIP_ORDER[a.tip] -
                        TIP_ORDER[b.tip]
                    );
                }

                return (
                    a.kvota1 -
                    b.kvota1
                );
            }
        );


        prikazi(
            sveUtakmice
        );


        debug.innerHTML =

            "<details>" +

                "<summary>" +
                    "OCR pročitano" +
                "</summary>" +

                "<pre>" +

                escapeHTML(
                    sviOCR.join(
                        "\n\n====================\n\n"
                    )
                ) +

                "</pre>" +

            "</details>";


        progress.style.width =
            "100%";


        status.textContent =
            "Gotovo — pronađeno " +
            sveUtakmice.length +
            " utakmica.";

    }

    catch(error) {

        console.error(error);

        status.textContent =
            "GREŠKA: " +
            error.message;

        alert(
            "Greška tijekom analize: " +
            error.message
        );
    }


    button.disabled = false;
}


/* =====================================================
   OBRADA JEDNE SLIKE
===================================================== */

function obradiSliku(tekst) {

    tekst =
        normaliziraj(
            tekst
        );


    /*
       Ključna stvar:

       svaki zapis koji počinje vremenom
       postaje zasebna utakmica.

       Primjer:

       19:30 Estoril - Benfica 8.20 5.70 1.29 1:4
       19:30 Famalicao - Alverca 1.60 4.05 5.00 1:1

       postaju 2 potpuno odvojena bloka.
    */


    tekst =
        tekst.replace(
            /(^|\s)([0-2]?\d)\s*[:.]\s*([0-5]\d)\s+(?=[A-Za-zÀ-ž])/g,
            "\n$2:$3 "
        );


    /*
       OCR ponekad pročita:

       19 30 Famalicao

       umjesto

       19:30 Famalicao
    */


    tekst =
        tekst.replace(
            /(^|\s)([0-2]?\d)\s+([0-5]\d)\s+(?=[A-Za-zÀ-ž])/g,
            "\n$2:$3 "
        );


    const siroviRedovi =
        tekst
        .split("\n")
        .map(
            function(x) {
                return x.trim();
            }
        )
        .filter(Boolean);


    let blokovi = [];

    let trenutniBlok = "";

    let trenutnaLiga = "";


    for (
        let i = 0;
        i < siroviRedovi.length;
        i++
    ) {

        const red =
            siroviRedovi[i];


        /*
           Ako je liga, samo zapamti.
        */

        if (jeLiga(red)) {

            trenutnaLiga =
                ocistiLigu(red);

            continue;
        }


        /*
           NOVA utakmica počinje vremenom.
        */

        if (
            /^[0-2]?\d:[0-5]\d\b/.test(red)
        ) {

            if (trenutniBlok) {

                blokovi.push({
                    tekst: trenutniBlok.trim(),
                    liga: trenutnaLiga
                });
            }


            trenutniBlok =
                red;

        }

        else {

            /*
               Dodaj samo ako već postoji
               otvorena utakmica.

               Ali NE dopuštamo dodavanje
               iza pojave drugog vremena.
            */

            if (trenutniBlok) {

                trenutniBlok +=
                    " " +
                    red;
            }
        }
    }


    if (trenutniBlok) {

        blokovi.push({
            tekst: trenutniBlok.trim(),
            liga: trenutnaLiga
        });
    }


    let rezultati = [];


    for (
        let i = 0;
        i < blokovi.length;
        i++
    ) {

        const u =
            parsirajJednuUtakmicu(
                blokovi[i].tekst,
                blokovi[i].liga
            );


        if (u) {

            rezultati.push(u);
        }
    }


    return rezultati;
}


/* =====================================================
   PARSIRANJE TOČNO JEDNE UTAKMICE
===================================================== */

function parsirajJednuUtakmicu(red, liga) {

    /*
       Prva zaštita:

       ako se iz nekog razloga unutra
       pojavilo drugo vrijeme,
       odsijeci sve od drugog vremena.
    */


    const svaVremena =
        [...red.matchAll(
            /\b[0-2]?\d:[0-5]\d\b/g
        )];


    if (svaVremena.length > 1) {

        red =
            red.substring(
                0,
                svaVremena[1].index
            );
    }


    const vrijemeMatch =
        red.match(
            /^([0-2]?\d):([0-5]\d)\b/
        );


    if (!vrijemeMatch) {

        return null;
    }


    const vrijeme =
        vrijemeMatch[1]
        .padStart(2, "0")
        +
        ":"
        +
        vrijemeMatch[2];


    /*
       Iz istog reda pronađi sve brojeve.
    */


    const brojevi =
        pronadiKvoteURedu(
            red
        );


    if (brojevi.length < 3) {

        return null;
    }


    /*
       Pronađi tip NA KRAJU ISTOG REDA.

       Ovo je važno.

       Ne uzimamo prvi rezultat koji vidimo.
    */


    const tipPodatak =
        pronadiTipNaKraju(
            red
        );


    if (!tipPodatak) {

        return null;
    }


    /*
       Sve kvote moraju biti prije tipa.

       Tako se sprječava da rezultat/tip
       bude pročitan kao kvota.
    */


    const kvotePrijeTipa =
        brojevi.filter(
            function(x) {
                return x.index < tipPodatak.index;
            }
        );


    if (kvotePrijeTipa.length < 3) {

        return null;
    }


    /*
       Kod tablice su zadnja 3 decimalna broja
       prije tipa upravo:

       1   X   2

       Ovo sprječava preuzimanje brojeva
       iz naziva ili vremena.
    */


    const zadnjeTri =
        kvotePrijeTipa.slice(-3);


    const kvota1 =
        zadnjeTri[0].value;

    const kvotaX =
        zadnjeTri[1].value;

    const kvota2 =
        zadnjeTri[2].value;


    /*
       FILTER
    */


    if (
        kvota1 < MIN_KVOTA ||
        kvota1 > MAX_KVOTA
    ) {

        return null;
    }


    if (
        kvotaX < 1.01 ||
        kvotaX > 50
    ) {

        return null;
    }


    if (
        kvota2 < 1.01 ||
        kvota2 > 50
    ) {

        return null;
    }


    /*
       Sada naziv uzimamo SAMO između
       vremena i prve od tri kvote.
    */


    const krajVremena =
        vrijemeMatch[0].length;


    const pocetakKvota =
        zadnjeTri[0].index;


    let naziv =
        red.substring(
            krajVremena,
            pocetakKvota
        );


    naziv =
        naziv
        .replace(
            /\b1\s+X\s+2\s+Tip\b/gi,
            ""
        )
        .replace(
            /\bMore\b.*$/gi,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();


    /*
       Ukloni eventualne brojke koje je OCR
       zalijepio iza imena kluba.

       Primjer:
       Estoril - Benfica 820 570 129
    */


    naziv =
        naziv.replace(
            /\s+\d{3,4}(?:\s+\d{3,4})*.*$/,
            ""
        );


    /*
       Mora postojati samo jedan glavni
       separator domaćin - gost.
    */


    const parMatch =
        naziv.match(
            /^(.+?)\s*-\s*(.+)$/
        );


    if (!parMatch) {

        return null;
    }


    let domacin =
        ocistiNaziv(
            parMatch[1]
        );


    let gost =
        ocistiNaziv(
            parMatch[2]
        );


    /*
       Ako se pojavilo "More",
       makni sve iza njega.
    */


    gost =
        gost.split(
            /\bMore\b/i
        )[0]
        .trim();


    /*
       Ako naziv gosta sadrži tri cijela
       OCR broja kao 820 570 129,
       makni ih.
    */


    gost =
        gost.replace(
            /\s+\d{3,4}(?:\s+\d{3,4})+.*$/,
            ""
        )
        .trim();


    if (
        !domacin ||
        !gost
    ) {

        return null;
    }


    if (
        domacin.length > 55 ||
        gost.length > 55
    ) {

        return null;
    }


    return {

        vrijeme: vrijeme,

        domacin: domacin,

        gost: gost,

        liga: liga,

        kvota1: kvota1,

        kvotaX: kvotaX,

        kvota2: kvota2,

        tip: tipPodatak.tip
    };
}


/* =====================================================
   KVOTE U JEDNOM REDU
===================================================== */

function pronadiKvoteURedu(red) {

    let lista = [];


    /*
       Standard:

       1.60
       4.05
       5.00
    */


    const decimalRegex =
        /\b(\d{1,2}[.,]\d{1,2})\b/g;


    let match;


    while (
        (match = decimalRegex.exec(red))
        !== null
    ) {

        const value =
            parseFloat(
                match[1]
                .replace(",", ".")
            );


        if (
            value >= 1.01 &&
            value <= 50
        ) {

            lista.push({
                value: value,
                index: match.index
            });
        }
    }


    /*
       Ako imamo barem tri normalne kvote,
       koristimo njih.
    */


    if (lista.length >= 3) {

        return lista;
    }


    /*
       Rezervno:

       OCR:

       160 405 500

       pretvara se u:

       1.60 4.05 5.00
    */


    lista = [];


    const cijeliRegex =
        /\b(\d{3,4})\b/g;


    while (
        (match = cijeliRegex.exec(red))
        !== null
    ) {

        const raw =
            match[1];


        let value;


        if (raw.length === 3) {

            value =
                Number(
                    raw.charAt(0) +
                    "." +
                    raw.substring(1)
                );

        }

        else {

            value =
                Number(
                    raw.substring(
                        0,
                        raw.length - 2
                    )
                    +
                    "."
                    +
                    raw.substring(
                        raw.length - 2
                    )
                );
        }


        if (
            value >= 1.01 &&
            value <= 50
        ) {

            lista.push({
                value: value,
                index: match.index
            });
        }
    }


    return lista;
}


/* =====================================================
   TIP SAMO NA KRAJU RETKA
===================================================== */

function pronadiTipNaKraju(red) {

    /*
       Normalan oblik:

       2:0
       2:1
       3:0
       3:1
       4:0
       4:1
    */


    const svi =
        [...red.matchAll(
            /\b([234])\s*[:\-]\s*([01])\b/g
        )];


    /*
       Idemo od zadnjeg prema prvom,
       jer tip je zadnji podatak u retku.
    */


    for (
        let i = svi.length - 1;
        i >= 0;
        i--
    ) {

        const tip =
            svi[i][1] +
            ":" +
            svi[i][2];


        if (
            TIPOVI.includes(tip)
        ) {

            return {
                tip: tip,
                index: svi[i].index
            };
        }
    }


    /*
       OCR bez dvotočke:

       20
       21
       30
       31
       40
       41

       ali samo blizu kraja retka.
    */


    const bezDvotocke =
        red.match(
            /\b(20|21|30|31|40|41)\b\s*(?:More)?\s*$/
        );


    if (bezDvotocke) {

        return {

            tip:
                bezDvotocke[1][0] +
                ":" +
                bezDvotocke[1][1],

            index:
                bezDvotocke.index
        };
    }


    return null;
}


/* =====================================================
   LIGA
===================================================== */

function jeLiga(red) {

    if (
        /^[0-2]?\d:[0-5]\d/.test(red)
    ) {

        return false;
    }


    return (
        /League/i.test(red) ||
        /Liga/i.test(red) ||
        /Division/i.test(red) ||
        /Cup/i.test(red) ||
        /Premiership/i.test(red) ||
        /Championship/i.test(red) ||
        /Allsvenskan/i.test(red) ||
        /Superettan/i.test(red) ||
        /Ekstraklasa/i.test(red) ||
        /Eredivisie/i.test(red) ||
        /Juniors/i.test(red) ||
        /U19/i.test(red)
    );
}


function ocistiLigu(red) {

    return String(red)

        .replace(
            /\b1\s+X\s+2\s+Tip\b/gi,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =====================================================
   NORMALIZACIJA
===================================================== */

function normaliziraj(text) {

    return String(text)

        .replace(/\r/g, "\n")

        .replace(/,/g, ".")

        .replace(/\|/g, " ")

        .replace(/[‐-‒–—]/g, "-")

        .replace(/\t/g, " ")

        .replace(/[ ]+/g, " ")

        .replace(/\n{2,}/g, "\n")

        .trim();
}


/* =====================================================
   NAZIV KLUBA
===================================================== */

function ocistiNaziv(text) {

    return String(text)

        .replace(
            /[^A-Za-zÀ-ž0-9 .&'()\/+\-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =====================================================
   DUPLIKATI
=============================================
