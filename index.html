<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza velikih kvota</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
}

.info{
    background:#eaf4ff;
    padding:14px;
    border-left:5px solid #1677ff;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.6;
}

.box{
    background:white;
    padding:16px;
    border-radius:12px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    border:2px dashed #aaa;
    border-radius:10px;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#1677ff;
    color:white;
    font-size:18px;
    font-weight:bold;
}

button:disabled{
    background:#999;
}

#status{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

.progress{
    background:#ddd;
    height:18px;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

#progressBar{
    width:0%;
    height:100%;
    background:#1677ff;
}

.tipNaslov{
    background:#1677ff;
    color:white;
    padding:13px;
    border-radius:10px;
    font-size:24px;
    font-weight:bold;
    margin:22px 0 12px;
}

.utakmica{
    background:white;
    padding:16px;
    margin-bottom:15px;
    border-radius:12px;
    border-left:5px solid #1677ff;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.par{
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

.liga{
    color:#666;
    margin-bottom:10px;
}

.kvote{
    font-size:17px;
    line-height:1.8;
}

.tip{
    margin-top:12px;
    color:#d00000;
    font-size:20px;
    font-weight:bold;
}

.nema{
    padding:18px;
    background:#fff3cd;
    border-radius:10px;
    text-align:center;
}

details{
    margin-top:20px;
    background:white;
    padding:12px;
    border-radius:10px;
}

pre{
    white-space:pre-wrap;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>⚽ Analiza velikih kvota</h1>

<div class="info">
<strong>Kvota domaćina:</strong> 1.60 – 2.10<br>
<strong>Tipovi:</strong> 2:0, 2:1, 3:0, 3:1, 4:0, 4:1
</div>

<div class="box">

<input
type="file"
id="images"
accept="image/*"
multiple
>

<button
id="btn"
onclick="analiziraj()"
>
ANALIZIRAJ SLIKE
</button>

<div id="status"></div>

<div class="progress">
<div id="progressBar"></div>
</div>

</div>

<div id="rezultati"></div>

<div id="debug"></div>

</div>


<script>

const MIN_KVOTA = 1.60;
const MAX_KVOTA = 2.10;

const TIPOVI = [
"2:0",
"2:1",
"3:0",
"3:1",
"4:0",
"4:1"
];

const TIP_ORDER = {
"2:0":1,
"2:1":2,
"3:0":3,
"3:1":4,
"4:0":5,
"4:1":6
};


/* =========================
   ANALIZA SLIKA
========================= */

async function analiziraj(){

    const input =
        document.getElementById("images");

    const status =
        document.getElementById("status");

    const btn =
        document.getElementById("btn");

    const progress =
        document.getElementById("progressBar");

    const rezultati =
        document.getElementById("rezultati");

    const debug =
        document.getElementById("debug");


    if(input.files.length === 0){

        alert("Odaberi barem jednu sliku.");

        return;
    }


    btn.disabled = true;

    rezultati.innerHTML = "";

    debug.innerHTML = "";

    progress.style.width = "0%";


    let sve = [];

    let rawOCR = [];


    try{

        for(
            let i = 0;
            i < input.files.length;
            i++
        ){

            status.innerHTML =
            "Analiziram sliku " +
            (i + 1) +
            " od " +
            input.files.length +
            "...";


            const result =
            await Tesseract.recognize(

                input.files[i],

                "eng",

                {

                    logger:function(m){

                        if(
                            m.status ===
                            "recognizing text"
                        ){

                            const pct =
                            (
                                i +
                                m.progress
                            )
                            /
                            input.files.length
                            *
                            100;

                            progress.style.width =
                            pct + "%";
                        }
                    }
                }
            );


            const tekst =
            result.data.text || "";


            rawOCR.push(
                "SLIKA " +
                (i + 1) +
                "\n\n" +
                tekst
            );


            const pronadene =
            pronadiUtakmice(
                tekst
            );


            sve =
            sve.concat(
                pronadene
            );
        }


        sve =
        ukloniDuplikate(
            sve
        );


        sve.sort(
            function(a,b){

                if(
                    TIP_ORDER[a.tip] !==
                    TIP_ORDER[b.tip]
                ){

                    return (
                        TIP_ORDER[a.tip] -
                        TIP_ORDER[b.tip]
                    );
                }

                return (
                    a.kvota1 -
                    b.kvota1
                );
            }
        );


        prikazi(
            sve
        );


        debug.innerHTML =
        "<details>" +
        "<summary>OCR pročitano</summary>" +
        "<pre>" +
        escapeHTML(
            rawOCR.join(
                "\n\n====================\n\n"
            )
        ) +
        "</pre>" +
        "</details>";


        progress.style.width =
        "100%";


        status.innerHTML =
        "Gotovo — pronađeno " +
        sve.length +
        " utakmica.";

    }
    catch(error){

        console.error(error);

        status.innerHTML =
        "Dogodila se greška. Pokušaj ponovno.";

        alert(
            "Greška tijekom analize: " +
            error.message
        );
    }


    btn.disabled = false;
}



/* =========================
   OCR PARSER
========================= */

function pronadiUtakmice(tekst){

    let lista = [];


    tekst = tekst

    .replace(/\r/g,"\n")

    .replace(/,/g,".")

    .replace(/\|/g," ")

    .replace(/[–—]/g,"-")

    .replace(/[ \t]+/g," ");


    /*
    OCR često pročita vrijeme:

    23 00
    18 45

    Pretvori u:

    23:00
    18:45
    */

    tekst = tekst.replace(
        /\b([0-2]?\d)\s+([0-5]\d)\s+(?=[A-Za-z])/g,
        "\n$1:$2 "
    );


    /*
    Novi blok prije svakog vremena
    */

    tekst = tekst.replace(
        /([^\n])\s+([0-2]\d:[0-5]\d)\s+/g,
        "$1\n$2 "
    );


    const linije = tekst

    .split("\n")

    .map(function(x){
        return x.trim();
    })

    .filter(function(x){
        return x.length > 0;
    });


    /*
    Stvaramo blokove.

    Svako vrijeme počinje novu utakmicu.
    */

    let blokovi = [];

    let trenutni = "";


    for(let i=0;i<linije.length;i++){

        let red =
        linije[i];


        if(
            /^[0-2]?\d:[0-5]\d\b/.test(red)
        ){

            if(trenutni){

                blokovi.push(
                    trenutni.trim()
                );
            }

            trenutni = red;

        }
        else{

            if(trenutni){

                trenutni +=
                " " +
                red;
            }
        }
    }


    if(trenutni){

        blokovi.push(
            trenutni.trim()
        );
    }


    /*
    Ako OCR nije našao vremena,
    rezervni način:
    analiziraj cijeli tekst po dijelovima.
    */

    if(blokovi.length === 0){

        for(
            let i=0;
            i<linije.length;
            i++
        ){

            let blok =
            linije
            .slice(
                i,
                Math.min(
                    i + 5,
                    linije.length
                )
            )
            .join(" ");

            blokovi.push(
                blok
            );
        }
    }


    for(
        let i=0;
        i<blokovi.length;
        i++
    ){

        const u =
        parsirajUtakmicu(
            blokovi[i]
        );


        if(u){

            lista.push(u);
        }
    }


    return lista;
}



/* =========================
   JEDNA UTAKMICA
========================= */

function parsirajUtakmicu(blok){

    let vrijeme = "";


    const time =
    blok.match(
        /^([0-2]?\d):([0-5]\d)/
    );


    if(time){

        vrijeme =
        time[1].padStart(2,"0")
        +
        ":"
        +
        time[2];
    }


    /*
    TIP
    */

    let tip = null;


    const tipRegex =
    /Tip\s*[:.]?\s*([234])\s*[:\-]\s*([01])/i;


    const tipMatch =
    blok.match(
        tipRegex
    );


    if(tipMatch){

        let t =
        tipMatch[1] +
        ":" +
        tipMatch[2];


        if(
            TIPOVI.includes(t)
        ){

            tip = t;
        }
    }


    /*
    Ako OCR nije pročitao riječ Tip
    */

    if(!tip){

        for(
            let i=0;
            i<TIPOVI.length;
            i++
        ){

            const t =
            TIPOVI[i];

            const p =
            t.split(":");


            const rgx =
            new RegExp(
                "\\b" +
                p[0] +
                "\\s*[:\\-]\\s*" +
                p[1] +
                "\\b"
            );


            if(
                rgx.test(blok)
            ){

                tip = t;

                break;
            }
        }
    }


    if(!tip){

        return null;
    }


    /*
    KVOTE

    prvenstveno tražimo:

    1: 1.90
    X: 3.45
    2: 4.10
    */

    let kvotaMatch =
    blok.match(
        /\b1\s*[:.]?\s*([1-9]\d*[.]\d{1,2})\s+X\s*[:.]?\s*([1-9]\d*[.]\d{1,2})\s+2\s*[:.]?\s*([1-9]\d*[.]\d{1,2})/i
    );


    let kvota1;
    let kvotaX;
    let kvota2;
    let kvotaPozicija;


    if(kvotaMatch){

        kvota1 =
        parseFloat(
            kvotaMatch[1]
        );

        kvotaX =
        parseFloat(
            kvotaMatch[2]
        );

        kvota2 =
        parseFloat(
            kvotaMatch[3]
        );

        kvotaPozicija =
        kvotaMatch.index;

    }
    else{

        /*
        Rezervno:
        uzmi decimalne brojeve
        */

        const found = [];

        const regex =
        /\b([1-9]\d?\.\d{1,2})\b/g;

        let m;


        while(
            (m = regex.exec(blok))
            !== null
        ){

            const n =
            parseFloat(m[1]);


            if(
                n >= 1.01 &&
                n <= 30
            ){

                found.push({
                    value:n,
                    index:m.index
                });
            }
        }


        if(found.length < 3){

            return null;
        }


        /*
        Tražimo prvi broj koji je
        u našem rasponu kvote domaćina.
        */

        let start = -1;


        for(
            let i=0;
            i<=found.length-3;
            i++
        ){

            if(
                found[i].value >= MIN_KVOTA &&
                found[i].value <= MAX_KVOTA
            ){

                start = i;

                break;
            }
        }


        if(start === -1){

            return null;
        }


        kvota1 =
        found[start].value;

        kvotaX =
        found[start+1].value;

        kvota2 =
        found[start+2].value;

        kvotaPozicija =
        found[start].index;
    }


    /*
    FILTER 1.60 - 2.10
    */

    if(
        kvota1 < MIN_KVOTA ||
        kvota1 > MAX_KVOTA
    ){

        return null;
    }


    /*
    Naziv utakmice
    */

    let prijeKvota =
    blok.substring(
        0,
        kvotaPozicija
    );


    /*
    ukloni vrijeme
    */

    prijeKvota =
    prijeKvota.replace(
        /^[0-2]?\d:[0-5]\d\s*/,
        ""
    );


    /*
    liga
    */

    let liga = "";


    const ligaMatch =
    prijeKvota.match(
        /\(([^()]*)\)/
    );


    if(ligaMatch){

        liga =
        ligaMatch[1];

        prijeKvota =
        prijeKvota.replace(
            ligaMatch[0],
            ""
        );
    }


    /*
    Zaštita protiv spajanja utakmica.

    Ako se pojavi More,
    odsijeci ostatak.
    */

    prijeKvota =
    prijeKvota.split(
        /\bMore\b/i
    )[0];


    prijeKvota =
    prijeKvota

    .replace(
        /\b\d{3}\s+\d{3}\s+\d{3}\b.*$/,
        ""
    )

    .replace(
        /\b1\s*[xX]\s*2\b.*$/,
        ""
    )

    .replace(
        /\s+/g,
        " "
    )

    .trim();


    /*
    Traži separator -
    */

    const par =
    prijeKvota.match(
        /^(.+?)\s+-\s+(.+)$/
    );


    if(!par){

        return null;
    }


    let domacin =
    ocistiNaziv(
        par[1]
    );


    let gost =
    ocistiNaziv(
        par[2]
    );


    /*
    Zaštita od ogromnih
    spojenih naziva.
    */

    if(
        domacin.length > 60 ||
        gost.length > 60
    ){

        return null;
    }


    if(
        !domacin ||
        !gost
    ){

        return null;
    }


    return {

        vrijeme:vrijeme,

        domacin:domacin,

        gost:gost,

        liga:liga,

        kvota1:kvota1,

        kvotaX:kvotaX,

        kvota2:kvota2,

        tip:tip

    };
}



/* =========================
   ČIŠĆENJE NAZIVA
========================= */

function ocistiNaziv(t){

    return String(t)

    .replace(
        /[^A-Za-zÀ-ž0-9 .&'()\/+-]/g,
        " "
    )

    .replace(
        /\s+/g,
        " "
    )

    .trim();
}



/* =========================
   DUPLIKATI
========================= */

function ukloniDuplikate(lista){

    const mapa =
    new Map();


    lista.forEach(
        function(u){

            const key =
            (
                u.domacin +
                "|" +
                u.gost +
                "|" +
                u.tip
            )

            .toLowerCase()

            .replace(
                /\s+/g,
                ""
            );


            if(
                !mapa.has(key)
            ){

                mapa.set(
                    key,
                    u
                );
            }
        }
    );


    return Array.from(
        mapa.values()
    );
}



/* =========================
   PRIKAZ
========================= */

function prikazi(lista){

    const div =
    document.getElementById(
        "rezultati"
    );


    div.innerHTML = "";


    if(lista.length === 0){

        div.innerHTML =
        '<div class="nema">' +
        'Nema pronađenih utakmica s kvotom 1 od ' +
        '<strong>1.60 do 2.10</strong>.' +
        '</div>';

        return;
    }


    let zadnjiTip = "";


    lista.forEach(
        function(u){


            if(
                u.tip !== zadnjiTip
            ){

                zadnjiTip =
                u.tip;


                div.innerHTML +=

                '<div class="tipNaslov">' +

                'Tip ' +
                u.tip +

                '</div>';
            }


            div.innerHTML +=

            '<div class="utakmica">' +

                (
                    u.vrijeme
                    ?
                    '<div><strong>' +
                    escapeHTML(u.vrijeme) +
                    '</strong></div>'
                    :
                    ''
                ) +

                '<div class="par">' +

                escapeHTML(u.domacin) +

                ' — ' +

                escapeHTML(u.gost) +

                '</div>' +

                (
                    u.liga
                    ?
                    '<div class="liga">(' +
                    escapeHTML(u.liga) +
                    ')</div>'
                    :
                    ''
                ) +

                '<div class="kvote">' +

                '1: <strong>' +
                u.kvota1.toFixed(2) +
                '</strong>' +

                '&nbsp;&nbsp; X: ' +
                u.kvotaX.toFixed(2) +

                '&nbsp;&nbsp; 2: ' +
                u.kvota2.toFixed(2) +

                '</div>' +

                '<div class="tip">' +

                'Tip: ' +
                u.tip +

                '</div>' +

            '</div>';

        }
    );
}



/* =========================
   HTML ZAŠTITA
========================= */

function escapeHTML(t){

    return String(t)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
