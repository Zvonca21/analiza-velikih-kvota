<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza velikih kvota</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

    margin:0;
    padding:10px;
    font-family:Arial,sans-serif;
    background:#f2f4f7;

}

    max-width:900px;

}

    text-align:center;

}

    background:#eaf4ff;

}

.box{
    background:#fff;

}

input[type=file]{
    width:100%;

}

}

}

}

}
</style>
</head>

<body>

<div class="container">

<h1>⚽ Analiza velikih kvota</h1>

<div class="info">

<strong>Kvota domaćina:</strong>
1.60 – 2.10

<br>

<strong>Tipovi:</strong>
2:0, 2:1, 3:0, 3:1, 4:0, 4:1

</div>

<div class="box">

<input
    type="file"
    id="images"
    accept="image/*"
    multiple
>

<button
    id="btn"
    onclick="analiziraj()"
>
ANALIZIRAJ SLIKE
</button>

<div id="status"></div>

<div class="progress">
    <div id="progressBar"></div>
</div>

</div>

<div id="rezultati"></div>

<div id="debug"></div>

</div>

<script>

/* ======================================
   POSTAVKE
====================================== */

const MIN_KVOTA = 1.60;
const MAX_KVOTA = 2.10;

const DOZVOLJENI_TIPOVI = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

const REDOSLIJED = {
    "2:0":1,
    "2:1":2,
    "3:0":3,
    "3:1":4,
    "4:0":5,
    "4:1":6
};


/* ======================================
   GLAVNA FUNKCIJA
====================================== */

async function analiziraj(){

    const input =
        document.getElementById("images");

    const btn =
        document.getElementById("btn");

    const status =
        document.getElementById("status");

    const progressBar =
        document.getElementById("progressBar");

    const debug =
        document.getElementById("debug");

    if(input.files.length === 0){

        alert("Odaberi barem jednu sliku.");

        return;
    }


    btn.disabled = true;

    document.getElementById("rezultati").innerHTML = "";

    debug.innerHTML = "";

    progressBar.style.width = "0%";


    let sveUtakmice = [];

    let rawTekst = [];


    try{

        for(
            let i = 0;
            i < input.files.length;
            i++
        ){

            status.innerHTML =
                "Analiziram sliku " +
                (i + 1) +
                " od " +
                input.files.length +
                "...";


            const rezultat =
                await Tesseract.recognize(
                    input.files[i],
                    "eng",
                    {

                        logger:function(m){

                            if(
                                m.status ===
                                "recognizing text"
                            ){

                                const pct =
                                    (
                                        i +
                                        m.progress
                                    )
                                    /
                                    input.files.length
                                    *
                                    100;

                                progressBar.style.width =
                                    pct + "%";
                            }
                        }
                    }
                );


            const text =
                rezultat.data.text || "";


            rawTekst.push(
                "SLIKA " +
                (i + 1) +
                "\n\n" +
                text
            );


            const pronadeno =
                parsirajSliku(text);


            sveUtakmice.push(
                ...pronadeno
            );
        }


        sveUtakmice =
            ukloniDuplikate(
                sveUtakmice
            );


        sveUtakmice.sort(
            function(a,b){

                const ta =
                    REDOSLIJED[a.tip] || 99;

                const tb =
                    REDOSLIJED[b.tip] || 99;


                if(ta !== tb){

                    return ta - tb;
                }


                return (
                    a.kvota1 -
                    b.kvota1
                );
            }
        );


        prikazi(
            sveUtakmice
        );


        debug.innerHTML = `

        <details>

        <summary>
        OCR pročitano
        </summary>

        <pre>${
            escapeHTML(
                rawTekst.join(
                    "\n\n====================\n\n"
                )
            )
        }</pre>

        </details>

        `;


        status.innerHTML =
            "Gotovo — pronađeno " +
            sveUtakmice.length +
            " utakmica.";


        progressBar.style.width =
            "100%";

    }
    catch(error){

        console.error(error);

        status.innerHTML =
            "Greška tijekom analize.";

        alert(
            "Greška: " +
            error.message
        );
    }


    btn.disabled = false;
}



/* ======================================
   PARSIRANJE CIJELE SLIKE
====================================== */

function parsirajSliku(tekst){

    tekst =
        normalizirajOCR(
            tekst
        );


    /*
    VAŽNO:

    Tesseract ponekad više utakmica
    stavi u isti red.

    Zato prije svakog vremena
    ubacujemo novi red.
    */


    tekst =
        tekst.replace(
            /(\s|^)([0-2]?\d)\s*[:.]\s*([0-5]\d)\s+(?=[A-Za-zÀ-ž])/g,
            "\n$2:$3 "
        );


    /*
    Vrijeme bez dvotočke:

    15 00 Tobol

    pretvaramo u

    15:00 Tobol
    */


    tekst =
        tekst.replace(
            /(\s|^)([0-2]?\d)\s+([0-5]\d)\s+(?=[A-Za-zÀ-ž])/g,
            "\n$2:$3 "
        );


    let linije =
        tekst
        .split("\n")
        .map(
            x => x.trim()
        )
        .filter(Boolean);


    let rezultati = [];

    let trenutnaLiga = "";


    for(
        let i = 0;
        i < linije.length;
        i++
    ){

        const red =
            linije[i];


        /*
        Prepoznaj ligu.
        Liga obično nema početno vrijeme,
        a sadrži riječi League, Division,
        Liga, Cup itd.
        */


        if(
            jeLiga(red)
        ){

            trenutnaLiga =
                ocistiLigu(red);

            continue;
        }


        /*
        Pokušaj parsiranja jednog reda.
        */


        let utakmica =
            parsirajRed(
                red,
                trenutnaLiga
            );


        if(utakmica){

            rezultati.push(
                utakmica
            );

            continue;
        }


        /*
        Ako je OCR razbio jednu utakmicu
        na 2 reda, spoji trenutni i sljedeći.
        */


        if(
            i + 1 <
            linije.length
        ){

            const kombinacija =
                red +
                " " +
                linije[i + 1];


            utakmica =
                parsirajRed(
                    kombinacija,
                    trenutnaLiga
                );


            if(utakmica){

                rezultati.push(
                    utakmica
                );

                i++;

                continue;
            }
        }


        /*
        Rezervno probaj 3 reda.
        */


        if(
            i + 2 <
            linije.length
        ){

            const kombinacija =
                red +
                " " +
                linije[i + 1] +
                " " +
                linije[i + 2];


            utakmica =
                parsirajRed(
                    kombinacija,
                    trenutnaLiga
                );


            if(utakmica){

                rezultati.push(
                    utakmica
                );

                i += 2;
            }
        }
    }


    return rezultati;
}



/* ======================================
   PARSIRANJE JEDNOG REDA
====================================== */

function parsirajRed(red, liga){

    /*
    Red treba sadržavati vrijeme.
    */


    const vrijemeMatch =
        red.match(
            /\b([0-2]?\d):([0-5]\d)\b/
        );


    if(!vrijemeMatch){

        return null;
    }


    const vrijeme =
        vrijemeMatch[1]
            .padStart(2,"0")
        +
        ":"
        +
        vrijemeMatch[2];


    /*
    TIP
    */


    const tip =
        pronadiTip(red);


    if(!tip){

        return null;
    }


    /*
    KVOTE
    */


    const kvote =
        pronadiTriKvote(red);


    if(!kvote){

        return null;
    }


    const kvota1 =
        kvote.kvota1;

    const kvotaX =
        kvote.kvotaX;

    const kvota2 =
        kvote.kvota2;


    /*
    FILTER 1.60 - 2.10
    */


    if(
        kvota1 < MIN_KVOTA ||
        kvota1 > MAX_KVOTA
    ){

        return null;
    }


    /*
    Tekst utakmice mora biti
    između vremena i prve kvote.
    */


    const krajVremena =
        vrijemeMatch.index +
        vrijemeMatch[0].length;


    let nazivDio =
        red.substring(
            krajVremena,
            kvote.pozicija
        );


    nazivDio =
        nazivDio
        .replace(
            /\bMore\b.*$/i,
            ""
        )
        .replace(
            /\bTip\b.*$/i,
            ""
        )
        .replace(
            /\b1\s+X\s+2\b/gi,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();


    /*
    Mora imati separator.
    */


    const par =
        nazivDio.match(
            /^(.+?)\s*[-–—]\s*(.+)$/
        );


    if(!par){

        return null;
    }


    let domacin =
        ocistiNaziv(
            par[1]
        );


    let gost =
        ocistiNaziv(
            par[2]
        );


    /*
    Sprečavanje spajanja
    nekoliko utakmica.
    */


    gost =
        gost.split(
            /\bMore\b/i
        )[0];


    gost =
        gost.replace(
            /\b\d{1,2}:\d{2}\b.*$/,
            ""
        );


    gost =
        gost.replace(
            /\b\d{3}\s+\d{3}\s+\d{3}\b.*$/,
            ""
        );


    gost =
        gost.trim();


    if(
        !domacin ||
        !gost
    ){

        return null;
    }


    if(
        domacin.length > 55 ||
        gost.length > 55
    ){

        return null;
    }


    return {

        vrijeme,

        domacin,

        gost,

        liga,

        kvota1,

        kvotaX,

        kvota2,

        tip
    };
}



/* ======================================
   TRAŽENJE KVOTA
====================================== */

function pronadiTriKvote(red){

    /*
    PRVI način:

    1.75 3.40 4.10
    */


    const decimalni = [];

    const regex =
        /\b(\d{1,2}[.,]\d{1,2})\b/g;


    let m;


    while(
        (m = regex.exec(red))
        !== null
    ){

        const value =
            parseFloat(
                m[1].replace(",",".")
            );


        if(
            value >= 1.01 &&
            value <= 50
        ){

            decimalni.push({

                value:value,

                index:m.index
            });
        }
    }


    /*
    Tražimo tri uzastopna broja,
    prvi mora biti moguća kvota 1.
    */


    for(
        let i = 0;
        i <= decimalni.length - 3;
        i++
    ){

        const a =
            decimalni[i];

        const b =
            decimalni[i + 1];

        const c =
            decimalni[i + 2];


        if(
            a.value >= 1.01 &&
            a.value <= 15 &&
            b.value >= 1.01 &&
            b.value <= 30 &&
            c.value >= 1.01 &&
            c.value <= 30
        ){

            return {

                kvota1:a.value,

                kvotaX:b.value,

                kvota2:c.value,

                pozicija:a.index
            };
        }
    }


    /*
    DRUGI način:

    OCR često:

    175 340 410

    umjesto:

    1.75 3.40 4.10
    */


    const cijeli = [];

    const regexCijeli =
        /\b(\d{3,4})\b/g;


    while(
        (m = regexCijeli.exec(red))
        !== null
    ){

        const raw =
            m[1];


        let broj;


        if(raw.length === 3){

            broj =
                parseFloat(
                    raw[0] +
                    "." +
                    raw.substring(1)
                );

        }
        else{

            broj =
                parseFloat(
                    raw.substring(
                        0,
                        raw.length - 2
                    )
                    +
                    "."
                    +
                    raw.substring(
                        raw.length - 2
                    )
                );
        }


        if(
            broj >= 1.01 &&
            broj <= 30
        ){

            cijeli.push({

                value:broj,

                index:m.index
            });
        }
    }


    for(
        let i = 0;
        i <= cijeli.length - 3;
        i++
    ){

        const a =
            cijeli[i];

        const b =
            cijeli[i + 1];

        const c =
            cijeli[i + 2];


        if(
            a.value >= 1.01 &&
            a.value <= 15
        ){

            return {

                kvota1:a.value,

                kvotaX:b.value,

                kvota2:c.value,

                pozicija:a.index
            };
        }
    }


    return null;
}



/* ======================================
   TIP
====================================== */

function pronadiTip(red){

    /*
    Standard:
    2:0
    2:1 itd.
    */


    const regex =
        /\b([234])\s*[:\-]\s*([01])\b/g;


    let match;

    let zadnji = null;


    while(
        (match = regex.exec(red))
        !== null
    ){

        const tip =
            match[1] +
            ":" +
            match[2];


        if(
            DOZVOLJENI_TIPOVI.includes(
                tip
            )
        ){

            zadnji = tip;
        }
    }


    if(zadnji){

        return zadnji;
    }


    /*
    OCR često pročita:
    20
    21
    30
    31
    40
    41
    */


    const kraj =
        red.match(
            /\b(20|21|30|31|40|41)\b(?:\s+More)?\s*$/i
        );


    if(kraj){

        const vrijednost =
            kraj[1];


        return (
            vrijednost[0] +
            ":" +
            vrijednost[1]
        );
    }


    /*
    Ako "More" stoji poslije tipa.
    */


    const beforeMore =
        red.match(
            /\b(20|21|30|31|40|41)\s+More\b/i
        );


    if(beforeMore){

        return (
            beforeMore[1][0] +
            ":" +
            beforeMore[1][1]
        );
    }


    return null;
}



/* ======================================
   LIGA
====================================== */

function jeLiga(red){

    if(
        /^\d{1,2}:\d{2}/.test(red)
    ){

        return false;
    }


    return (
        /league/i.test(red) ||
        /liga/i.test(red) ||
        /division/i.test(red) ||
        /premier/i.test(red) ||
        /championship/i.test(red) ||
        /cup/i.test(red) ||
        /serie/i.test(red) ||
        /superettan/i.test(red) ||
        /allsvenskan/i.test(red) ||
        /ekstraklasa/i.test(red) ||
        /eredivisie/i.test(red)
    );
}


function ocistiLigu(red){

    return red

        .replace(
            /\b1\s+X\s+2\s+Tip\b/gi,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}



/* ======================================
   NORMALIZACIJA
====================================== */

function normalizirajOCR(text){

    return String(text)

        .replace(/\r/g,"\n")

        .replace(/,/g,".")

        .replace(/[|]/g," ")

        .replace(/[‐-‒–—]/g,"-")

        .replace(/[ \t]+/g," ")

        .replace(/\n{2,}/g,"\n")

        .trim();
}



/* ======================================
   NAZIV
====================================== */

function ocistiNaziv(text){

    return String(text)

        .replace(
            /[^A-Za-zÀ-ž0-9 .&'()\/+\-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}



/* ======================================
   DUPLIKATI
====================================== */

function ukloniDuplikate(lista){

    const mapa =
        new Map();


    lista.forEach(
        function(u){

            const key =
                (
                    u.domacin +
                    "|" +
                    u.gost +
                    "|" +
                    u.tip
                )
                .toLowerCase()
                .replace(
                    /\s+/g,
                    ""
                );


            if(
                !mapa.has(key)
            ){

                mapa.set(
                    key,
                    u
                );
            }
        }
    );


    return Array.from(
        mapa.values()
    );
}



/* ======================================
   PRIKAZ
====================================== */

function prikazi(lista){

    const div =
        document.getElementById(
            "rezultati"
        );


    div.innerHTML = "";


    if(lista.length === 0){

        div.innerHTML = `

        <div class="nema">

        Nema pronađenih utakmica
        koje odgovaraju uvjetima:

        <br><br>

        <strong>
        kvota 1 od 1.60 do 2.10
        </strong>

        </div>

        `;

        return;
    }


    let zadnjiTip = "";


    lista.forEach(
        function(u){


            if(
                u.tip !== zadnjiTip
            ){

                zadnjiTip =
                    u.tip;


                div.innerHTML += `

                <div class="tipNaslov">

                Tip ${u.tip}

                </div>

                `;
