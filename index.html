<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza velikih kvota</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    font-family:Arial,sans-serif;
    background:#f3f4f8;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:34px;
    margin:28px 0;
    line-height:1.2;
}

.info{
    background:#e7f3ff;
    border-left:6px solid #1683ff;
    padding:18px;
    border-radius:14px;
    font-size:19px;
    line-height:1.7;
    margin-bottom:20px;
}

.box{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

input[type=file]{
    width:100%;
    padding:16px;
    border:2px dashed #999;
    border-radius:12px;
    background:#fafafa;
    font-size:16px;
}

button{
    width:100%;
    padding:18px;
    margin-top:18px;
    border:none;
    border-radius:12px;
    background:#1683ff;
    color:white;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#999;
    cursor:not-allowed;
}

#status{
    margin-top:18px;
    min-height:28px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.progress{
    width:100%;
    height:20px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-top:15px;
}

#progressBar{
    height:100%;
    width:0%;
    background:#1683ff;
    transition:width .2s;
}

.tipNaslov{
    background:#1683ff;
    color:white;
    padding:15px;
    border-radius:12px;
    font-size:26px;
    font-weight:bold;
    margin:25px 0 15px;
}

.utakmica{
    background:white;
    padding:18px;
    border-left:6px solid #1683ff;
    border-radius:13px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.vrijeme{
    font-size:18px;
    font-weight:bold;
    margin-bottom:7px;
}

.par{
    font-size:21px;
    font-weight:bold;
    line-height:1.35;
    margin-bottom:8px;
}

.liga{
    color:#666;
    margin-bottom:10px;
}

.kvote{
    font-size:17px;
    line-height:1.8;
}

.tip{
    margin-top:12px;
    font-size:20px;
    color:#d00000;
    font-weight:bold;
}

.nema{
    background:#fff3cd;
    padding:18px;
    border-radius:12px;
    text-align:center;
}

.warning{
    background:#ffe8e8;
    border-left:5px solid #d00000;
    padding:12px;
    border-radius:10px;
    margin-top:12px;
}

details{
    background:white;
    padding:14px;
    border-radius:12px;
    margin-top:20px;
}

pre{
    white-space:pre-wrap;
    word-break:break-word;
    font-size:12px;
}

@media(max-width:600px){
    h1{
        font-size:31px;
    }

    .info{
        font-size:18px;
    }

    .par{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>⚽ Analiza velikih kvota</h1>

<div class="info">
<strong>Kvota domaćina:</strong> 1.60 – 2.10<br>
<strong>Tipovi:</strong> 2:0, 2:1, 3:0, 3:1, 4:0, 4:1
</div>

<div class="box">

<input
    type="file"
    id="images"
    accept="image/*"
    multiple
>

<button
    type="button"
    id="analyzeButton"
    onclick="pokreniAnalizu()"
>
ANALIZIRAJ SLIKE
</button>

<div id="status"></div>

<div class="progress">
    <div id="progressBar"></div>
</div>

</div>

<div id="rezultati"></div>
<div id="debug"></div>

</div>

<script>

/* =========================================================
   POSTAVKE
========================================================= */

var MIN_KVOTA = 1.60;
var MAX_KVOTA = 2.10;

var TIPOVI = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

var TIP_ORDER = {
    "2:0":1,
    "2:1":2,
    "3:0":3,
    "3:1":4,
    "4:0":5,
    "4:1":6
};


/* =========================================================
   START
========================================================= */

async function pokreniAnalizu(){

    var input = document.getElementById("images");
    var button = document.getElementById("analyzeButton");
    var status = document.getElementById("status");
    var progress = document.getElementById("progressBar");
    var rezultatiDiv = document.getElementById("rezultati");
    var debugDiv = document.getElementById("debug");

    status.innerHTML = "POKRENUTO – pripremam OCR...";
    progress.style.width = "2%";

    if(!input.files || input.files.length === 0){
        status.innerHTML = "Odaberi barem jednu sliku.";
        alert("Odaberi barem jednu sliku.");
        return;
    }

    if(typeof Tesseract === "undefined"){
        status.innerHTML = "OCR biblioteka nije učitana.";
        alert("OCR se nije učitao. Osvježi stranicu i pokušaj ponovno.");
        return;
    }

    button.disabled = true;
    rezultatiDiv.innerHTML = "";
    debugDiv.innerHTML = "";

    var sve = [];
    var debugTekst = [];

    try{

        for(var i=0; i<input.files.length; i++){

            var file = input.files[i];
            var brojSlike = i + 1;

            status.innerHTML =
                "Analiziram sliku " +
                brojSlike +
                " od " +
                input.files.length +
                "...";

            var result = await Tesseract.recognize(
                file,
                "eng",
                {
                    logger:function(m){

                        if(m.status === "recognizing text"){

                            var ukupno =
                                (
                                    i +
                                    (m.progress || 0)
                                )
                                /
                                input.files.length
                                *
                                100;

                            progress.style.width =
                                Math.min(99, ukupno) + "%";

                            status.innerHTML =
                                "Analiziram sliku " +
                                brojSlike +
                                " od " +
                                input.files.length +
                                " – " +
                                Math.round((m.progress || 0) * 100) +
                                "%";
                        }
                    }
                }
            );

            var tekst = result.data.text || "";

            debugTekst.push(
                "SLIKA " + brojSlike + "\n\n" + tekst
            );

            var utakmice = obradiOCR(tekst);

            sve = sve.concat(utakmice);
        }

        sve = ukloniDuplikate(sve);

        sve.sort(function(a,b){

            var ta = TIP_ORDER[a.tip] || 99;
            var tb = TIP_ORDER[b.tip] || 99;

            if(ta !== tb){
                return ta - tb;
            }

            return a.kvota1 - b.kvota1;
        });

        prikaziRezultate(sve);

        debugDiv.innerHTML =
            '<details>' +
            '<summary>OCR pročitano</summary>' +
            '<pre>' +
            escapeHTML(
                debugTekst.join(
                    "\n\n====================\n\n"
                )
            ) +
            '</pre>' +
            '</details>';

        progress.style.width = "100%";

        status.innerHTML =
            "Gotovo – pronađeno " +
            sve.length +
            " utakmica.";

    }
    catch(error){

        console.error(error);

        status.innerHTML =
            "GREŠKA: " +
            error.message;

        alert(
            "Greška tijekom analize: " +
            error.message
        );
    }

    button.disabled = false;
}


/* =========================================================
   OCR OBRADA
========================================================= */

function obradiOCR(tekst){

    tekst = String(tekst)
        .replace(/\r/g,"\n")
        .replace(/,/g,".")
        .replace(/\|/g," ")
        .replace(/[–—]/g,"-")
        .replace(/\t/g," ")
        .replace(/ +/g," ");

    /*
       17 30 Klub
       -> 17:30 Klub
    */

    tekst = tekst.replace(
        /\b([0-2]?[0-9])\s+([0-5][0-9])\s+(?=[A-Za-zÀ-ž])/g,
        "\n$1:$2 "
    );

    /*
       Ako je više utakmica u istom OCR retku,
       razbij prije svakog vremena.
    */

    tekst = tekst.replace(
        /([^\n])\s+([0-2]?[0-9]:[0-5][0-9])\s+(?=[A-Za-zÀ-ž])/g,
        "$1\n$2 "
    );

    var linije = tekst
        .split("\n")
        .map(function(x){
            return x.trim();
        })
        .filter(function(x){
            return x.length > 0;
        });

    var lista = [];
    var liga = "";

    for(var i=0; i<linije.length; i++){

        var red = linije[i];

        if(jeLiga(red)){
            liga = ocistiLigu(red);
            continue;
        }

        var utakmica =
            parsirajJedanRed(
                red,
                liga
            );

        if(utakmica){
            lista.push(utakmica);
            continue;
        }

        /*
           Samo ako trenutni red počinje vremenom,
           a sljedeći NE počinje novim vremenom,
           pokušaj spojiti 2 reda.
        */

        if(
            /^[0-2]?[0-9]:[0-5][0-9]\b/.test(red)
            &&
            i + 1 < linije.length
            &&
            !/^[0-2]?[0-9]:[0-5][0-9]\b/.test(linije[i+1])
            &&
            !jeLiga(linije[i+1])
        ){

            var spoj =
                red +
                " " +
                linije[i+1];

            utakmica =
                parsirajJedanRed(
                    spoj,
                    liga
                );

            if(utakmica){
                lista.push(utakmica);
            }
        }
    }

    return lista;
}


/* =========================================================
   PARSIRANJE JEDNOG RETKA
========================================================= */

function parsirajJedanRed(red, liga){

    var vrijemeMatch = red.match(
        /^([0-2]?[0-9]):([0-5][0-9])\b/
    );

    if(!vrijemeMatch){
        return null;
    }

    var vrijeme =
        vrijemeMatch[1].padStart(2,"0") +
        ":" +
        vrijemeMatch[2];

    /*
       Ako se u istom zapisu pojavi drugo vrijeme,
       odbaci sve iza njega.
    */

    var ostatak =
        red.substring(
            vrijemeMatch[0].length
        );

    var drugoVrijeme = ostatak.search(
        /\b[0-2]?[0-9]:[0-5][0-9]\b/
    );

    if(drugoVrijeme >= 0){

        red = red.substring(
            0,
            vrijemeMatch[0].length +
            drugoVrijeme
        );
    }

    /*
       Tip tražimo samo na kraju tog retka.
    */

    var tipData =
        pronadiTipNaKraju(red);

    if(!tipData){
        return null;
    }

    /*
       Kvote tražimo isključivo prije tipa.
    */

    var prijeTipa =
        red.substring(
            0,
            tipData.index
        );

    var kvote =
        pronadiDecimalneKvote(
            prijeTipa
        );

    if(kvote.length < 3){

        kvote =
            pronadiKvoteBezTocke(
                prijeTipa
            );
    }

    if(kvote.length < 3){
        return null;
    }

    /*
       Zadnja 3 broja prije tipa = 1 X 2
    */

    var k =
        kvote.slice(-3);

    var kvota1 = k[0].value;
    var kvotaX = k[1].value;
    var kvota2 = k[2].value;

    if(
        kvota1 < MIN_KVOTA ||
        kvota1 > MAX_KVOTA
    ){
        return null;
    }

    /*
       Dodatna logička provjera.
    */

    if(
        kvotaX < 1.01 ||
        kvotaX > 50 ||
        kvota2 < 1.01 ||
        kvota2 > 50
    ){
        return null;
    }

    /*
       Naziv utakmice je samo
       između vremena i prve kvote.
    */

    var startNaziva =
        vrijemeMatch[0].length;

    var krajNaziva =
        k[0].index;

    var naziv =
        prijeTipa.substring(
            startNaziva,
            krajNaziva
        );

    naziv = naziv
        .replace(/\bMore\b.*$/i,"")
        .replace(/\b1\s+X\s+2\s+Tip\b/gi,"")
        .replace(/\s+/g," ")
        .trim();

    /*
       Makni OCR brojke zalijepljene uz klub:
       Benfica 820 570 129
    */

    naziv = naziv.replace(
        /\s+\d{3,4}(?:\s+\d{3,4})+.*$/,
        ""
    );

    var separator =
        naziv.indexOf("-");

    if(separator === -1){
        return null;
    }

    var domacin =
        naziv.substring(
            0,
            separator
        ).trim();

    var gost =
        naziv.substring(
            separator + 1
        ).trim();

    domacin = ocistiNaziv(domacin);
    gost = ocistiNaziv(gost);

    /*
       Ako gost još ima OCR kvote,
       ukloni ih.
    */

    gost = gost.replace(
        /\s+\d{3,4}(?:\s+\d{3,4})+.*$/,
        ""
    ).trim();

    if(!domacin || !gost){
        return null;
    }

    if(
        domacin.length > 60 ||
        gost.length > 60
    ){
        return null;
    }

    /*
       Spriječi očito spojene utakmice.
    */

    if(
        /\bMore\b/i.test(domacin) ||
        /\bMore\b/i.test(gost)
    ){
        return null;
    }

    return {
        vrijeme:vrijeme,
        domacin:domacin,
        gost:gost,
        liga:liga,
        kvota1:kvota1,
        kvotaX:kvotaX,
        kvota2:kvota2,
        tip:tipData.tip
    };
}


/* =========================================================
   KVOTE
========================================================= */

function pronadiDecimalneKvote(tekst){

    var lista = [];

    var regex =
        /\b([0-9]{1,2}\.[0-9]{1,2})\b/g;

    var match;

    while(
        (match = regex.exec(tekst))
        !== null
    ){

        var value =
            parseFloat(match[1]);

        if(
            value >= 1.01 &&
            value <= 50
        ){

            lista.push({
                value:value,
                index:match.index
            });
        }
    }

    return lista;
}


function pronadiKvoteBezTocke(tekst){

    var lista = [];

    var regex =
        /\b([0-9]{3,4})\b/g;

    var match;

    while(
        (match = regex.exec(tekst))
        !== null
    ){

        var raw =
            match[1];

        var value;

        if(raw.length === 3){

            value = parseFloat(
                raw.charAt(0) +
                "." +
                raw.substring(1)
            );

        }else{

            value = parseFloat(
                raw.substring(
                    0,
                    raw.length - 2
                )
                +
                "."
                +
                raw.substring(
                    raw.length - 2
                )
            );
        }

        if(
            value >= 1.01 &&
            value <= 50
        ){

            lista.push({
                value:value,
                index:match.index
            });
        }
    }

    return lista;
}


/* =========================================================
   TIP
========================================================= */

function pronadiTipNaKraju(red){

    /*
       Standardni oblik
    */

    var regex =
        /\b([234])\s*:\s*([01])\b/g;

    var matches = [];

    var match;

    while(
        (match = regex.exec(red))
        !== null
    ){

        var tip =
            match[1] +
            ":" +
            match[2];

        if(
            TIPOVI.indexOf(tip)
            !== -1
        ){

            matches.push({
                tip:tip,
                index:match.index
            });
        }
    }

    if(matches.length > 0){

        var zadnji =
            matches[
                matches.length - 1
            ];

        /*
           Tip mora biti pri kraju retka.
        */

        var ostatak =
            red.substring(
                zadnji.index +
                3
            );

        if(
            !/\d{1,2}:\d{2}/.test(ostatak)
        ){
            return zadnji;
        }
    }

    /*
       OCR bez dvotočke:
       20,21,30,31,40,41
    */

    var bez =
        red.match(
            /\b(20|21|30|31|40|41)\b\s*(?:More)?\s*$/
        );

    if(bez){

        return {
            tip:
                bez[1].charAt(0)
                +
                ":"
                +
                bez[1].charAt(1),
            index:bez.index
        };
    }

    return null;
}


/* =========================================================
   LIGA
========================================================= */

function jeLiga(red){

    if(
        /^[0-2]?[0-9]:[0-5][0-9]/
        .test(red)
    ){
        return false;
    }

    return (
        /League/i.test(red) ||
        /Liga/i.test(red) ||
        /Division/i.test(red) ||
        /Cup/i.test(red) ||
        /Premiership/i.test(red) ||
        /Championship/i.test(red) ||
        /Allsvenskan/i.test(red) ||
        /Superettan/i.test(red) ||
        /Ekstraklasa/i.test(red) ||
        /Eredivisie/i.test(red) ||
        /U19/i.test(red)
    );
}


function ocistiLigu(red){

    return String(red)
        .replace(
            /\b1\s+X\s+2\s+Tip\b/gi,
            ""
        )
        .replace(/\s+/g," ")
        .trim();
}


/* =========================================================
   NAZIV
========================================================= */

function ocistiNaziv(text){

    return String(text)
        .replace(
            /[^A-Za-zÀ-ž0-9 .&'()\/+\-]/g,
            " "
        )
        .replace(/\s+/g," ")
        .trim();
}


/* =========================================================
   DUPLIKATI
========================================================= */

function ukloniDuplikate(lista){

    var mapa = {};

    return lista.filter(function(u){

        var key =
            (
                u.domacin +
                "|" +
                u.gost +
                "|" +
                u.tip +
                "|" +
                u.kvota1
            )
            .toLowerCase()
            .replace(/\s+/g,"");

        if(mapa[key]){
            return false;
        }

        mapa[key] = true;

        return true;
    });
}


/* =========================================================
   PRIKAZ
========================================================= */

function prikaziRezultate(lista){

    var div =
        document.getElementById(
            "rezultati"
        );

    div.innerHTML = "";

    if(lista.length === 0){

        div.innerHTML =
            '<div class="nema">' +
            'Nema pronađenih utakmica s kvotom domaćina od ' +
            '<strong>1.60 do 2.10</strong>.' +
            '</div>';

        return;
    }

    var zadnjiTip = "";

    lista.forEach(function(u){

        if(u.tip !== zadnjiTip){

            zadnjiTip = u.tip;

            div.innerHTML +=
                '<div class="tipNaslov">' +
                'Tip ' +
                escapeHTML(u.tip) +
                '</div>';
        }

        div.innerHTML +=

            '<div class="utakmica">' +

                '<div class="vrijeme">' +
                escapeHTML(u.vrijeme) +
                '</div>' +

                '<div class="par">' +
                escapeHTML(u.domacin) +
                ' — ' +
                escapeHTML(u.gost) +
                '</div>' +

                (
                    u.liga
                    ?
                    '<div class="liga">(' +
                    escapeHTML(u.liga) +
                    ')</div>'
                    :
                    ''
                ) +

                '<div class="kvote">' +

                '1: <strong>' +
                u.kvota1.toFixed(2) +
                '</strong>' +

                '&nbsp;&nbsp; X: ' +
                u.kvotaX.toFixed(2) +

                '&nbsp;&nbsp; 2: ' +
                u.kvota2.toFixed(2) +

                '</div>' +

                '<div class="tip">' +
                'Tip: ' +
                escapeHTML(u.tip) +
                '</div>' +

            '</div>';
    });
}


/*
