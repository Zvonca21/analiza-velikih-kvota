<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analiza velikih kvota</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 8px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 14px;
    border-radius: 14px;
}

h1 {
    text-align: center;
    font-size: 25px;
}

.opis {
    text-align: center;
    color: #555;
    line-height: 1.5;
    margin-bottom: 20px;
}

input[type="file"] {
    width: 100%;
    margin: 15px 0;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    background: #1976d2;
    color: white;
    border: 0;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    background: #999;
}

#status {
    margin-top: 16px;
    padding: 12px;
    background: #eee;
    border-radius: 9px;
    text-align: center;
    font-weight: bold;
}

.grupa {
    margin-top: 25px;
}

.grupa h2 {
    background: #1976d2;
    color: white;
    padding: 12px;
    border-radius: 9px;
    font-size: 21px;
}

.utakmica {
    border: 1px solid #ddd;
    border-radius: 9px;
    background: #fafafa;
    padding: 13px;
    margin-bottom: 20px;
}

.par {
    font-size: 18px;
    font-weight: bold;
}

.liga {
    margin-top: 6px;
    color: #555;
}

.kvote {
    margin-top: 10px;
}

.tip {
    margin-top: 8px;
    font-weight: bold;
}

.nema {
    padding: 20px;
    margin-top: 20px;
    text-align: center;
    background: #fff3cd;
    border-radius: 9px;
}

details {
    margin-top: 20px;
    background: #f7f7f7;
    padding: 10px;
    border-radius: 8px;
}

pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>⚽ Analiza velikih kvota</h1>

<div class="opis">
Prikazuju se samo tipovi
<strong>2:0, 2:1, 3:0, 3:1, 4:0 i 4:1</strong><br>
uz kvotu domaćina od
<strong>1.60 do 2.10</strong>.
</div>

<input type="file" id="slike" accept="image/*" multiple>

<button id="gumb" onclick="analizirajSlike()">
Analiziraj slike
</button>

<div id="status">Spremno za analizu.</div>

<div id="rezultati"></div>

<details>
<summary>OCR pročitao</summary>
<pre id="ocrTekst"></pre>
</details>

</div>

<script>

const MIN_KVOTA = 1.60;
const MAX_KVOTA = 2.10;

const TIPOVI = [
    "2:0",
    "2:1",
    "3:0",
    "3:1",
    "4:0",
    "4:1"
];

const REDOSLIJED = {
    "2:0": 0,
    "2:1": 1,
    "3:0": 2,
    "3:1": 3,
    "4:0": 4,
    "4:1": 5
};


/* ==============================
   NORMALIZACIJA OCR TEKSTA
============================== */

function normaliziraj(s) {

    return String(s || "")
        .replace(/\r/g, "")
        .replace(/[|]/g, " ")
        .replace(/\t/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* ==============================
   PREPOZNAVANJE VREMENA
============================== */

function jeVrijeme(s) {

    if (!s) return false;

    return /^([01]?\d|2[0-3]):[0-5]\d$/
        .test(s.trim());
}


/* ==============================
   PREPOZNAVANJE KVOTE
============================== */

function kvotaIzTokena(token) {

    if (!token) return null;

    let s = String(token)
        .trim()
        .replace(",", ".")
        .replace(/[Oo]/g, "0")
        .replace(/[Il|]/g, "1")
        .replace(/[^\d.]/g, "");

    if (!s) return null;


    /* normalna kvota npr. 1.85 */

    if (s.includes(".")) {

        const dijelovi = s.split(".");

        if (dijelovi.length > 2) {
            return null;
        }

        const n = parseFloat(s);

        if (
            !isNaN(n) &&
            n >= 1.01 &&
            n <= 50
        ) {
            return n;
        }

        return null;
    }


    /* OCR zna pročitati 1.85 kao 185 */

    if (/^\d{3}$/.test(s)) {

        const n = parseFloat(
            s[0] + "." + s.slice(1)
        );

        if (
            n >= 1.01 &&
            n <= 9.99
        ) {
            return n;
        }
    }


    /* OCR zna pročitati 10.50 kao 1050 */

    if (/^\d{4}$/.test(s)) {

        const n = parseFloat(
            s.slice(0, 2) +
            "." +
            s.slice(2)
        );

        if (
            n >= 10 &&
            n <= 50
        ) {
            return n;
        }
    }

    return null;
}


/* ==============================
   PREPOZNAVANJE TIPA
============================== */

function tipIzTokena(token) {

    if (!token) return null;

    let s = String(token)
        .replace(/[Oo]/g, "0")
        .replace(/[Il|]/g, "1")
        .replace(/\s/g, "")
        .replace(/[;,.]/g, ":");


    let m = s.match(/^([234]):([01])$/);

    if (m) {

        const tip = `${m[1]}:${m[2]}`;

        if (TIPOVI.includes(tip)) {
            return tip;
        }
    }


    /* npr. 20 → 2:0 */

    m = s.match(/^([234])([01])$/);

    if (m) {

        const tip = `${m[1]}:${m[2]}`;

        if (TIPOVI.includes(tip)) {
            return tip;
        }
    }


    /* dodatne OCR greške */

    if (s === "220") return "2:0";
    if (s === "221") return "2:1";

    if (s === "330") return "3:0";
    if (s === "331") return "3:1";

    if (s === "440") return "4:0";
    if (s === "441") return "4:1";

    return null;
}


/* ==============================
   PREPOZNAVANJE LIGE
============================== */

function jeLiga(red) {

    if (!red) return false;

    if (
        /\b([01]?\d|2[0-3]):[0-5]\d\b/
        .test(red)
    ) {
        return false;
    }

    const r = red.toLowerCase();

    const pojmovi = [

        "liga",
        "league",
        "premier",
        "premiership",
        "division",
        "serie",
        "bundesliga",
        "superliga",
        "championship",
        "ettan",
        "allsvenskan",
        "damallsvenskan",
        "segunda",
        "primera",
        "snl",
        "cup",
        "kup",
        "superettan",
        "eliteserien",
        "veikkausliiga",
        "ykkosliiga",
        "meistriliiga",
        "virsliga",
        "ekstraklasa",
        "prva liga",
        "premijer liga",
        "national league"
    ];

    return pojmovi.some(
        x => r.includes(x)
    );
}


/* ==============================
   ČIŠĆENJE NAZIVA LIGE
============================== */

function ocistiLigu(red) {

    let liga = normaliziraj(red);

    liga = liga.replace(
        /^[=~¥¢@#|»«\[\]{}()]+/g,
        ""
    );

    liga = liga.trim();


    liga = liga.replace(
        /^(HB|M1|M11|B11|B1|BY|B¥|Y2C|¥2¢)\s+/i,
        ""
    );


    liga = liga.replace(
        /^[A-Z0-9¥¢@]{1,3}\s+(?=[A-ZÀ-Ž])/,
        ""
    );


    /* ukloni zaglavlje kvota */

    liga = liga.replace(
        /\s+1\s*[xX]+\s*2\s*[Tt](?:p|ip)\s*$/i,
        ""
    );

    liga = liga.replace(
        /\s+1[xX]\s*2\s*[Tt](?:p|ip)\s*$/i,
        ""
    );

    liga = liga.replace(
        /\s+1\s*[xX]\s*2\s*$/i,
        ""
    );


    liga = liga
        .replace(
            /^[^A-Za-zÀ-ž]+/,
            ""
        )
        .replace(/\s+/g, " ")
        .trim();


    return liga || "Nepoznata liga";
}


/* ==============================
   PRAVLJENJE ZAPISA UTAKMICA
============================== */

function napraviZapise(text) {

    const redovi = text
        .split("\n")
        .map(normaliziraj)
        .filter(Boolean);

    const zapisi = [];

    let trenutnaLiga =
        "Nepoznata liga";

    let trenutnaUtakmica =
        null;


    function spremiUtakmicu() {

        if (!trenutnaUtakmica) {
            return;
        }

        zapisi.push({

            liga:
                trenutnaUtakmica.liga,

            tekst:
                normaliziraj(
                    trenutnaUtakmica.tekst
                )
        });

        trenutnaUtakmica =
            null;
    }


    for (const red of redovi) {


        /* NOVA LIGA */

        if (jeLiga(red)) {

            spremiUtakmicu();

            const liga =
                ocistiLigu(red);

            if (liga) {

                trenutnaLiga =
                    liga;
            }

            continue;
        }


        /* NOVA UTAKMICA */

        const vrijeme = red.match(
            /\b([01]?\d|2[0-3]):[0-5]\d\b/
        );

        if (vrijeme) {

            spremiUtakmicu();

            trenutnaUtakmica = {

                liga:
                    trenutnaLiga,

                tekst:
                    red
            };

            continue;
        }


        /* nastavak prethodnog reda */

        if (trenutnaUtakmica) {

            trenutnaUtakmica.tekst +=
                " " + red;
        }
    }


    spremiUtakmicu();

    return zapisi;
}


/* ==============================
   PRONAĐI CRTICU IZMEĐU EKIPA
============================== */

function pronadiCrticu(tokeni, vrijemeIndex) {

    for (
        let i = vrijemeIndex + 1;
        i < tokeni.length;
        i++
    ) {

        const t =
            tokeni[i].trim();

        if (
            t === "-" ||
            t === "–" ||
            t === "—" ||
            t === "−"
        ) {
            return i;
        }
    }

    return -1;
}


/* ==============================
   OBRADA JEDNE UTAKMICE
============================== */

function obradiZapis(zapis) {

    const red =
        normaliziraj(
            zapis.tekst
        );

    const tokeni =
        red.split(" ");

    if (!tokeni.length) {
        return null;
    }


    const vrijemeIndex =
        tokeni.findIndex(
            jeVrijeme
        );

    if (vrijemeIndex === -1) {
        return null;
    }


    const vrijeme =
        tokeni[vrijemeIndex];


    const crticaIndex =
        pronadiCrticu(
            tokeni,
            vrijemeIndex
        );

    if (crticaIndex === -1) {
        return null;
    }


    /* PRONAĐI TIP */

    let tip = null;
    let tipIndex = -1;

    for (
        let i = tokeni.length - 1;
        i > crticaIndex;
        i--
    ) {

        const t =
            tipIzTokena(
                tokeni[i]
            );

        if (
            t &&
            TIPOVI.includes(t)
        ) {

            tip = t;
            tipIndex = i;

            break;
        }
    }


    if (!tip) {
        return null;
    }


    /* PRONAĐI 3 KVOTE */

    const kvote = [];

    for (
        let i = tipIndex - 1;
        i > crticaIndex;
        i--
    ) {

        const k =
            kvotaIzTokena(
                tokeni[i]
            );

        if (k !== null) {

            kvote.unshift({

                vrijednost:
                    k,

                index:
                    i
            });

            if (
                kvote.length === 3
            ) {
                break;
            }
        }
    }


    if (
        kvote.length !== 3
    ) {
        return null;
    }


    const q1 =
        kvote[0].vrijednost;

    const qx =
        kvote[1].vrijednost;

    const q2 =
        kvote[2].vrijednost;


    /* ==========================
       GLAVNI FILTER KVOTE
       1.60 DO 2.10
    ========================== */

    if (
        q1 < MIN_KVOTA ||
        q1 > MAX_KVOTA
    ) {
        return null;
    }


    /* DOMAĆIN */

    const domacin =
        tokeni
            .slice(
                vrijemeIndex + 1,
                crticaIndex
            )
            .join(" ")
            .trim();


    /* GOST */

    const prviKvoteIndex =
        kvote[0].index;

    const gost =
        tokeni
            .slice(
                crticaIndex + 1,
                prviKvoteIndex
            )
            .join(" ")
            .trim();


    if (
        !domacin ||
        !gost
    ) {
        return null;
    }


    return {

        vrijeme,

        liga:
            zapis.liga,

        domacin,

        gost,

        jedan:
            q1,

        x:
            qx,

        dva:
            q2,

        tip
    };
}


/* ==============================
   OBRADA OCR TEKSTA
============================== */

function obradiOCR(text) {

    const zapisi =
        napraviZapise(text);

    const rezultat = [];

    for (
        const zapis of zapisi
    ) {

        const utakmica =
            obradiZapis(zapis);

        if (utakmica) {

            rezultat.push(
                utakmica
            );
        }
    }

    return rezultat;
}


/* ==============================
   UKLANJANJE DUPLIKATA
============================== */

function ukloniDuplikate(lista) {

    const seen =
        new Set();

    return lista.filter(
        u => {

            const key = [

                u.liga,
                u.domacin,
                u.gost,
                u.tip,
                u.jedan

            ]
            .join("|")
            .toLowerCase();

            if (
                seen.has(key)
            ) {
                return false;
            }

            seen.add(key);

            return true;
        }
    );
}


/* ==============================
   SORTIRANJE
============================== */

function sortiraj(lista) {

    return lista.sort(
        (a, b) => {

            const A =
                REDOSLIJED[a.tip];

            const B =
                REDOSLIJED[b.tip];


            /* prvo po tipu */

            if (A !== B) {

                return A - B;
            }


            /* zatim po kvoti
               od manje prema većoj */

            return (
                a.jedan -
                b.jedan
            );
        }
    );
}


/* ==============================
   PRIKAZ REZULTATA
============================== */

function prikazi(lista) {

    const container =
        document.getElementById(
            "rezultati"
        );

    container.innerHTML = "";


    if (!lista.length) {

        container.innerHTML = `

            <div class="nema">

                Nema pronađenih utakmica
                s tipovima
                2:0, 2:1, 3:0, 3:1,
                4:0 ili 4:1

                <br><br>

                i kvotom domaćina
                od 1.60 do 2.10.

            </div>

        `;

        return;
    }


    for (
        const tip of TIPOVI
    ) {

        const grupa =
            lista.filter(
                u =>
                    u.tip === tip
            );


        if (
            !grupa.length
        ) {
            continue;
        }


        const box =
            document.createElement(
                "div"
            );

        box.className =
            "grupa";


        const naslov =
            document.createElement(
                "h2"
            );

        naslov.textContent =
            "Tip " + tip;

        box.appendChild(
            naslov
        );


        for (
            const u of grupa
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "utakmica";


            div.innerHTML = `

                <div class="par">

                    ${u.vrijeme}
                    ${u.domacin}
                    -
                    ${u.gost}

                </div>


                <div class="liga">

                    (${u.liga})

                </div>


                <div class="kvote">

                    1:
                    <strong>
                    ${u.jedan.toFixed(2)}
                    </strong>

                    &nbsp;&nbsp;

                    X:
                    ${u.x.toFixed(2)}

                    &nbsp;&nbsp;

                    2:
                    ${u.dva.toFixed(2)}

                </div>


                <div class="tip">

                    Tip:
                    ${u.tip}

                </div>

            `;


            box.appendChild(
                div
            );
        }


        container.appendChild(
            box
        );
    }
}


/* ==============================
   GLAVNA ANALIZA SLIKA
============================== */

async function analizirajSlike() {

    const input =
        document.getElementById(
            "slike"
        );

    const status =
        document.getElementById(
            "status"
        );

    const gumb =
        document.getElementById(
            "gumb"
        );

    const ocr =
        document.getElementById(
            "ocrTekst"
        );


    if (
        !input.files ||
        !input.files.length
    ) {

        alert(
            "Prvo odaberi slike."
        );

        return;
    }


    gumb.disabled =
        true;


    document.getElementById(
        "rezultati"
    ).innerHTML = "";


    ocr.textContent =
        "";


    let sve = [];
    let debug = "";


    try {


        for (
            let i = 0;
            i < input.files.length;
            i++
        ) {

            const file =
                input.files[i];


            status.textContent =
                `Priprema slike ${i + 1}/${input.files.length}...`;


            const rezultat =
                await Tesseract.recognize(

                    file,

                    "eng",

                    {

                        logger: m => {

                            if (
                                m.status ===
                                "recognizing text"
                            ) {

                                const p =
                                    Math.round(
                                        m.progress *
                                        100
                                    );


                                status.textContent =

                                    `Slika ${i + 1}/${input.files.length} - ${p}%`;
                            }
                        }
                    }
                );


            const tekst =
                rezultat.data.text ||
                "";


            debug +=

                `\n\n===== SLIKA ${i + 1} =====\n${tekst}`;


            const pronadjene =
                obradiOCR(
                    tekst
                );


            sve.push(
                ...pronadjene
            );
        }


        /* ukloni duplikate */

        sve =
            ukloniDuplikate(
                sve
            );


        /* sortiraj */

        sve =
            sortiraj(
                sve
            );


        /* prikaži */

        prikazi(
            sve
        );


        /* OCR tekst */

        ocr.textContent =
            debug;


        status.textContent =

            `Gotovo. Pronađeno utakmica: ${sve.length}`;


    } catch (greska) {


        console.error(
            greska
        );


        status.textContent =

            "Greška tijekom analize.";


        alert(

            "Dogodila se greška tijekom analize."
        );


    } finally {


        gumb.disabled =
            false;
    }
}

</script>

</body>
</html>
